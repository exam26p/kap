<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة البيانات والنطاق الجغرافي الذكي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .form-container, .list-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0069d9; }
        .btn-warning { background-color: #ffc107; color: #212529; font-weight: bold; }
        .btn-warning:hover { background-color: #e0a905; }
        .btn-danger { background-color: #dc3545; color: white; padding: 6px 12px; font-size: 14px; width: auto; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-edit { background-color: #17a2b8; color: white; padding: 6px 12px; font-size: 14px; width: auto; margin-left: 5px; }
        .btn-edit:hover { background-color: #138496; }
        
        button:disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed;
        }
        .location-status {
            font-size: 14px;
            padding: 12px;
            margin-top: 8px;
            color: #0056b3;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
            background: #e7f3ff;
            border: 1px solid #b8daff;
            line-height: 1.6;
        }
        /* تصميم قائمة عرض المواقع */
        .location-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }
        .location-item h4 {
            margin: 0 0 10px 0;
            color: #007bff;
        }
        .location-item p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .badge-edit {
            background-color: #ffc107;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .pulse-loader {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #dc3545;
            border-radius: 50%;
            margin-left: 5px;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 id="formTitle">إضافة نسخة جديدة ونطاق جغرافي</h2>
    
    <div id="editModeIndicator" style="display: none;" class="badge-edit">🔄 وضع التعديل النشط</div>

    <form id="dataForm">
        <div class="form-group">
            <label for="versionNumber">رقم النسخة:</label>
            <input type="text" id="versionNumber" required placeholder="مثال: 1.0.2">
        </div>

        <div class="form-group">
            <button type="button" id="getLocationBtn" class="btn-primary">ابدأ تحديث الموقع التلقائي (البحث عن أعلى دقة)</button>
            <div id="locationStatus" class="location-status">البث متوقف. اضغط على الزر بالأعلى لبدء التحديث التلقائي الحي.</div>
        </div>

        <button type="submit" id="submitBtn" class="btn-success" disabled>حفظ البيانات في Firebase</button>
        <button type="button" id="cancelEditBtn" class="btn-danger" style="display: none; width: 100%;">إلغاء التعديل والعودة للوضع العادي</button>
    </form>
</div>

<div class="list-container">
    <h3>المواقع والنطاقات المحفوظة حالياً</h3>
    <div id="locationsList">جاري تحميل المواقع من Firebase...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyCEEqEALOCaQo5oSoR8A_Jh9eSpHS8Sz5o",
        authDomain: "game1-bb93e.firebaseapp.com",
        databaseURL: "https://game1-bb93e-default-rtdb.firebaseio.com",
        projectId: "game1-bb93e",
        storageBucket: "game1-bb93e.firebasestorage.app",
        messagingSenderId: "268851425259",
        appId: "1:268851425259:web:0074f52657190d7347b3ae"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let centerLatitude = null;
    let centerLongitude = null;
    let locationAccuracy = null;
    let editNodeKey = null; 
    let watchId = null; // الاحتفاظ بمعرّف التحديث التلقائي لإيقافه عند الحاجة

    const getLocationBtn = document.getElementById('getLocationBtn');
    const locationStatus = document.getElementById('locationStatus');
    const submitBtn = document.getElementById('submitBtn');
    const dataForm = document.getElementById('dataForm');
    const locationsList = document.getElementById('locationsList');
    
    const formTitle = document.getElementById('formTitle');
    const editModeIndicator = document.getElementById('editModeIndicator');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    // --- 1. البحث التلقائي والمستمر عن الموقع للحصول على أفضل دقة ---
    getLocationBtn.addEventListener('click', () => {
        // إذا كان هناك بث شغال مسبقاً، نقوم بإيقافه أولاً لإعادة تشغيله فريش
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
        }

        if (navigator.geolocation) {
            locationStatus.innerHTML = `<span class="pulse-loader"></span> جاري البحث المباشر وتحديث الدقة تلقائياً... تحرك لمكان مكشوف`;
            locationStatus.style.color = "#0056b3";
            locationStatus.style.background = "#e7f3ff";

            const options = {
                enableHighAccuracy: true, // إجبار الجهاز على تشغيل الـ GPS الفعلي
                timeout: 15000,           // انتظر 15 ثانية كحد أقصى لكل تحديث
                maximumAge: 0             // عدم قبول قراءات قديمة ومخزنة مؤقتاً
            };

            // استخدام watchPosition للحصول على تحديثات مستمرة للموقع والدقة
            watchId = navigator.geolocation.watchPosition(successLocation, errorLocation, options);
            
            // تغيير شكل الزر ليوضح أنه يعمل حالياً ويبحث بنشاط
            getLocationBtn.innerText = "🔄 الـ GPS يعمل الآن (يحدّث تلقائياً)";
            getLocationBtn.className = "btn-warning";
        } else {
            locationStatus.innerText = "المتصفح الخاص بك لا يدعم تحديد المواقع.";
        }
    });

    function successLocation(position) {
        // تحديث المتغيرات بأحدث وأدق قراءة واصلة الآن
        centerLatitude = position.coords.latitude;
        centerLongitude = position.coords.longitude;
        locationAccuracy = position.coords.accuracy;

        // عرض البيانات الفورية للمستخدم مع نسبة الخطأ (الأمتار)
        locationStatus.innerHTML = `
            ✅ تم التقاط إحداثيات دقيقة ومحدثة تلقائياً!<br>
            <b>خط العرض:</b> ${centerLatitude.toFixed(7)}<br>
            <b>خط الطول:</b> ${centerLongitude.toFixed(7)}<br>
            <b>مستوى الدقة الحالي:</b> <span style="color: #28a745;">+/- ${locationAccuracy.toFixed(1)} متر</span><br>
            <small style="color: #666;">(كلما قلّ رقم الأمتار، زادت الدقة. اترك الجهاز لثوانٍ ليثبت على أفضل نتيجة)</small>
        `;
        locationStatus.style.color = "#155724";
        locationStatus.style.background = "#d4edda";
        locationStatus.style.border = "1px solid #c3e6cb";
        
        submitBtn.disabled = false; // تفعيل زر الحفظ مباشرة لأن لدينا قراءة ممتازة
    }

    function errorLocation(error) {
        locationStatus.style.color = "#721c24";
        locationStatus.style.background = "#f8d7da";
        locationStatus.style.border = "1px solid #f5c6cb";
        
        switch(error.code) {
            case error.PERMISSION_DENIED:
                locationStatus.innerText = "يرجى السماح بالوصول إلى الموقع الجغرافي من إعدادات المتصفح.";
                break;
            case error.POSITION_UNAVAILABLE:
                locationStatus.innerText = "إشارة الـ GPS ضعيفة أو معلومات الموقع غير متوفرة حالياً.";
                break;
            case error.TIMEOUT:
                locationStatus.innerText = "انتهت مهلة جلب الموقع، النظام مستمر في المحاولة...";
                break;
            default:
                locationStatus.innerText = "حدث خطأ أثناء محاولة تحديث الموقع تلقائياً.";
                break;
        }
    }

    // --- 2. جلب وعرض البيانات من Firebase في الوقت الفعلي ---
    const cobesRef = ref(database, 'cobes');
    
    onValue(cobesRef, (snapshot) => {
        locationsList.innerHTML = ""; 
        
        if (snapshot.exists()) {
            const data = snapshot.val();
            
            Object.keys(data).reverse().forEach((key) => {
                const item = data[key];
                const geo = item.geo_zone || {};
                const acc = geo.accuracy_registered ? geo.accuracy_registered.toFixed(1) : 'غير مسجل';
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'location-item';
                itemDiv.innerHTML = `
                    <h4>النسخة: ${item.version_number}</h4>
                    <p><b>خط العرض:</b> ${geo.center_latitude}</p>
                    <p><b>خط الطول:</b> ${geo.center_longitude}</p>
                    <p><b>نصف القطر الثابت:</b> ${geo.radius_meters} متر</p>
                    <p><b>دقة الحفظ المسجلة:</b> +/- ${acc} متر</p>
                    <p><small style="color:#777;">تاريخ الحفظ: ${new Date(item.created_at).toLocaleString('ar-EG')}</small></p>
                    <div class="actions">
                        <button class="btn-edit" data-id="${key}">تعديل الموقِع</button>
                        <button class="btn-danger" data-id="${key}">حذف</button>
                    </div>
                `;
                locationsList.appendChild(itemDiv);
            });

            activateListButtons(data);
        } else {
            locationsList.innerText = "لا توجد مواقع محفوظة حالياً في قاعدة البيانات.";
        }
    });

    function activateListButtons(allData) {
        // أزرار الحذف
        document.querySelectorAll('.btn-danger[data-id]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = e.target.getAttribute('data-id');
                if(confirm("هل أنت متأكد من حذف هذا الموقع نهائياً؟")) {
                    remove(ref(database, `cobes/${id}`))
                    .then(() => alert("تم الحذف بنجاح."))
                    .catch(err => alert("حدث خطأ أثناء الحذف: " + err.message));
                }
            });
        });

        // أزرار التعديل
        document.querySelectorAll('.btn-edit[data-id]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = e.target.getAttribute('data-id');
                const targetData = allData[id];
                
                editNodeKey = id;
                document.getElementById('versionNumber').value = targetData.version_number;
                
                centerLatitude = targetData.geo_zone.center_latitude;
                centerLongitude = targetData.geo_zone.center_longitude;
                locationAccuracy = targetData.geo_zone.accuracy_registered || 0;

                locationStatus.innerHTML = `
                    ⚠️ تم تحميل إحداثيات الموقع المحفوظ مسبقاً.<br>
                    <b>خط العرض:</b> ${centerLatitude}<br>
                    <b>خط الطول:</b> ${centerLongitude}<br>
                    (لتحديث الموقع بأعلى دقة الآن، اضغط على زر التحديث التلقائي بالأعلى قبل الحفظ)
                `;
                locationStatus.style.color = "#856404";
                locationStatus.style.background = "#fff3cd";
                locationStatus.style.border = "1px solid #ffeeba";

                formTitle.innerText = "تعديل بيانات النسخة ونطاقها";
                editModeIndicator.style.display = "block";
                cancelEditBtn.style.display = "block";
                submitBtn.innerText = "تحديث وإعادة حفظ في Firebase";
                submitBtn.className = "btn-warning";
                submitBtn.disabled = false; 
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }

    // --- 3. إرسال النموذج (حفظ الجديد أو تحديث الحالي) ---
    dataForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const version = document.getElementById('versionNumber').value;

        const targetData = {
            version_number: version,
            geo_zone: {
                center_latitude: centerLatitude,
                center_longitude: centerLongitude,
                radius_meters: 100,
                accuracy_registered: locationAccuracy
            },
            created_at: new Date().toISOString()
        };

        if (editNodeKey) {
            // تحديث السجل الحالي في وضع التحرير
            update(ref(database, `cobes/${editNodeKey}`), targetData)
            .then(() => {
                alert('تم تحديث البيانات والإحداثيات عالية الدقة بنجاح!');
                resetFormToNormal();
            })
            .catch((error) => alert("خطأ أثناء التحديث: " + error.message));
        } else {
            // إضافة سجل جديد تماماً
            const newCobeRef = push(cobesRef);
            set(newCobeRef, targetData)
            .then(() => {
                alert('تم حفظ البيانات والنطاق الجغرافي الجديد بنجاح!');
                resetFormToNormal();
            })
            .catch((error) => alert("خطأ أثناء الحفظ: " + error.message));
        }
    });

    cancelEditBtn.addEventListener('click', resetFormToNormal);

    function resetFormToNormal() {
        // إيقاف بث الـ GPS التلقائي عند الحفظ أو الإلغاء لتوفير بطارية المستخدم
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
        }

        editNodeKey = null;
        centerLatitude = null;
        centerLongitude = null;
        locationAccuracy = null;
        
        dataForm.reset();
        
        formTitle.innerText = "إضافة نسخة جديدة ونطاق جغرافي";
        editModeIndicator.style.display = "none";
        cancelEditBtn.style.display = "none";
        
        getLocationBtn.innerText = "ابدأ تحديث الموقع التلقائي (البحث عن أعلى دقة)";
        getLocationBtn.className = "btn-primary";

        submitBtn.innerText = "حفظ البيانات في Firebase";
        submitBtn.className = "btn-success";
        submitBtn.disabled = true;

        locationStatus.innerText = "البث متوقف. اضغط على الزر بالأعلى لبدء التحديث التلقائي الحي.";
        locationStatus.style.color = "#0056b3";
        locationStatus.style.background = "#e7f3ff";
        locationStatus.style.border = "1px solid #b8daff";
    }
</script>

</body>
</html>
