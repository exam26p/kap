<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove, push, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const db = getDatabase(initializeApp({
        apiKey: "AIzaSyCEEqEALOCaQo5oSoR8A_Jh9eSpHS8Sz5o",
        authDomain: "game1-bb93e.firebaseapp.com",
        databaseURL: "https://game1-bb93e-default-rtdb.firebaseio.com",
        projectId: "game1-bb93e"
    }));

    let allDevices = {}, allUsers = {}, allArchive = {}, allMenu = {}, allTables = {}, allSessions = {};

    function fmt(n) { return Number(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

    /* ===== نظام Toast ===== */
    function toast(msg, type='info') {
        var wrap = document.getElementById('toastWrap');
        var icons = {success:'fa-check-circle', error:'fa-times-circle', info:'fa-info-circle'};
        var el = document.createElement('div');
        el.className = 'toast toast-' + type;
        el.innerHTML = '<i class="fas ' + (icons[type]||icons.info) + '"></i> ' + msg;
        wrap.appendChild(el);
        setTimeout(function(){ el.classList.add('out'); setTimeout(function(){ el.remove(); }, 300); }, 3000);
    }

    /* ===== نظام التأكيد ===== */
    var confirmResolver = null;
    function showConfirm(msg) {
        return new Promise(function(resolve) {
            confirmResolver = resolve;
            document.getElementById('confirmMsg').textContent = msg;
            document.getElementById('confirmOverlay').classList.add('show');
        });
    }
    document.getElementById('confirmYes').addEventListener('click', function() {
        document.getElementById('confirmOverlay').classList.remove('show');
        if (confirmResolver) confirmResolver(true);
    });
    document.getElementById('confirmNo').addEventListener('click', function() {
        document.getElementById('confirmOverlay').classList.remove('show');
        if (confirmResolver) confirmResolver(false);
    });

    window.toggleForm = function(id) {
        var el = document.getElementById(id);
        el.style.display = (el.style.display === 'none') ? 'block' : 'none';
    };

    /* ===== التنقل السفلي ===== */
    var tabTitles = {devices:'الأجهزة', users:'اليوزرات', sales:'المبيعات', orders:'المنتجات'};
    function switchTab(tabId) {
        document.querySelectorAll('.tab-panel').forEach(function(el){ el.classList.remove('active'); });
        document.querySelectorAll('.bnav-item').forEach(function(el){ el.classList.remove('active'); });
        document.getElementById('tab-' + tabId).classList.add('active');
        var btn = document.querySelector('.bnav-item[data-tab="'+tabId+'"]');
        if (btn) btn.classList.add('active');
        document.getElementById('pageTitle').textContent = tabTitles[tabId] || '';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }
    document.querySelectorAll('.bnav-item[data-tab]').forEach(function(btn) {
        btn.addEventListener('click', function() { if (!this.disabled) switchTab(this.getAttribute('data-tab')); });
    });

    /* ===== تحديث الإحصائيات ===== */
    function updateStats() {
        document.getElementById('stDevices').textContent = Object.keys(allDevices).length;
        document.getElementById('stUsers').textContent = Object.keys(allUsers).length;
        document.getElementById('stTables').textContent = Object.keys(allTables).length;
        var total = 0;
        for (var k in allArchive) { total += (Number(allArchive[k].price) * Number(allArchive[k].quantity)); }
        document.getElementById('stRevenue').textContent = fmt(total);
    }

    /* ===== البدء الرئيسي ===== */
    function initSystemCore() {
        onValue(ref(db, 'admines'), function(snap) {
            allDevices = snap.val() || {};
            renderDevicesList();
            updateStats();
            var statusEl = document.getElementById('sysStatus');
            if (Object.keys(allDevices).length > 0) {
                statusEl.className = 'status-chip on';
                document.getElementById('statusText').textContent = 'متصل';
                document.querySelectorAll('.nav-restricted').forEach(function(b){ b.disabled = false; });
            } else {
                statusEl.className = 'status-chip off';
                document.getElementById('statusText').textContent = 'غير متصل';
                document.querySelectorAll('.nav-restricted').forEach(function(b){ b.disabled = true; });
                switchTab('devices');
            }
        });

        onValue(ref(db, 'users'), function(snap) {
            allUsers = snap.val() || {};
            renderUsersList();
            updateSalesUsersDropdown();
            updateStats();
        });

        onValue(ref(db, 'tablesD/archive_orders'), function(snap) {
            allArchive = snap.val() || {};
            renderOrdersStatsList();
            updateStats();
        });

        onValue(ref(db, 'orders'), function(snap) {
            allMenu = snap.val() || {};
            renderOrdersStatsList();
        });

        onValue(ref(db, 'tablesA'), function(snap) {
            allTables = snap.val() || {};
            updateStats();
        });

        // إضافة مستمع لجدول الجلسات النشطة
        onValue(ref(db, 'active_sessions'), function(snap) {
            allSessions = snap.val() || {};
        });
    }

    /* =========================================
       📱 قسم الأجهزة
       ========================================= */
    window.verifyVersionFromCobes = function() {
        var inputVer = document.getElementById('inputVersionCheck').value.trim();
        var msgEl = document.getElementById('verifyMsg');
        if (!inputVer) { msgEl.innerHTML = '<div class="alert alert-error"><i class="fas fa-exclamation-circle"></i> أدخل رقم الإصدار</div>'; return; }
        msgEl.innerHTML = '<div class="alert alert-info"><i class="fas fa-spinner fa-spin"></i> جاري الفحص...</div>';
        get(ref(db, 'cobes')).then(function(snap) {
            if (!snap.exists()) { msgEl.innerHTML = '<div class="alert alert-error"><i class="fas fa-times-circle"></i> جدول cobes غير موجود</div>'; return; }
            var found = false;
            var cobesData = snap.val();
            for (var key in cobesData) { if (cobesData[key].version_number === inputVer) { found = true; break; } }
            if (found) {
                msgEl.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle"></i> تم المطابقة! انتقل للخطوة التالية.</div>';
                document.getElementById('deviceSaveForm').style.display = 'block';
            } else {
                msgEl.innerHTML = '<div class="alert alert-error"><i class="fas fa-times-circle"></i> الإصدار غير مطابق</div>';
                document.getElementById('deviceSaveForm').style.display = 'none';
            }
        });
    };

    window.saveDeviceToAdmines = function() {
        var name = document.getElementById('inputDeviceName').value.trim();
        var ver = document.getElementById('inputVersionCheck').value.trim();
        if (!name) { toast('اكتب اسم الجهاز', 'error'); return; }
        push(ref(db, 'admines'), { device_name: name, version_number: ver, created_at: new Date().toISOString() }).then(function() {
            toast('تم حفظ الجهاز بنجاح', 'success');
            document.getElementById('inputDeviceName').value = '';
            document.getElementById('inputVersionCheck').value = '';
            document.getElementById('deviceVerifyForm').style.display = 'none';
            document.getElementById('deviceSaveForm').style.display = 'none';
        });
    };

    window.deleteDevice = async function(key) {
        var ok = await showConfirm('هل أنت متأكد من حذف الجهاز؟ سيُغلق النظام إذا لم يبقَ أجهزة.');
        if (ok) remove(ref(db, 'admines/' + key)).then(function() { toast('تم الحذف', 'success'); });
    };

    function renderDevicesList() {
        var list = document.getElementById('devicesList');
        var keys = Object.keys(allDevices);
        document.getElementById('devCount').textContent = keys.length;
        list.innerHTML = '';
        if (keys.length === 0) { list.innerHTML = '<div class="empty-state" style="padding:20px;text-align:center;color:var(--text-muted)"><i class="fas fa-mobile-alt"></i><p>لا أجهزة مسجلة</p></div>'; return; }
        keys.forEach(function(key) {
            var d = allDevices[key];
            var el = document.createElement('div'); el.className = 'm-card';
            el.innerHTML = '<div class="m-row"><span class="m-label">الجهاز</span><span class="m-val"><b>' + d.device_name + '</b></span></div>' +
                '<div class="m-row"><span class="m-label">الإصدار</span><span class="badge badge-amber">' + d.version_number + '</span></div>' +
                '<div class="m-row"><span class="m-label">التسجيل</span><span class="m-val" style="font-size:11px;color:var(--text-secondary)">' + new Date(d.created_at).toLocaleDateString('ar-IQ') + '</span></div>' +
                '<div class="m-actions"><button class="btn btn-danger btn-sm btn-block" onclick="deleteDevice(\'' + key + '\')"><i class="fas fa-trash"></i> حذف الجهاز</button></div>';
            list.appendChild(el);
        });
    }

    /* =========================================
       👥 قسم اليوزرات (محدث)
       ========================================= */
    window.openUserForm = function(isEdit, key, username, password) {
        var box = document.getElementById('userFormBox'); box.style.display = 'block';
        if (isEdit) {
            document.getElementById('userFormTitle').textContent = 'تعديل الحساب';
            document.getElementById('editUserKey').value = key;
            document.getElementById('inputUsername').value = username;
            document.getElementById('inputPassword').value = password;
        } else {
            document.getElementById('userFormTitle').textContent = 'إنشاء حساب';
            document.getElementById('editUserKey').value = '';
            document.getElementById('inputUsername').value = '';
            document.getElementById('inputPassword').value = '';
        }
    };

    // دالة مساعدة لمزامنة الجلسات النشطة عند تعديل اسم المستخدم أو كلمة المرور
    async function syncActiveSessions(oldUsername, newUsername, newPasswordChanged) {
        const sessionRef = ref(db, 'active_sessions');
        const snapshot = await get(sessionRef);
        if (!snapshot.exists()) return;

        const updates = {};
        const sessions = snapshot.val();

        for (let sessionKey in sessions) {
            if (sessions[sessionKey].username === oldUsername) {
                // تحديث الاسم الجديد في الجلسة
                updates[sessionKey + '/username'] = newUsername;
                
                // إذا تم تغيير كلمة المرور، نقوم بوضع علامة لفصل الجلسة لإجبار المستخدم على إعادة تسجيل الدخول
                // إذا لا تريد فصل الجلسة عند تغيير الباسورد، احذف السطر التالي
                if (newPasswordChanged) {
                    updates[sessionKey + '/force_logout'] = true;
                }
            }
        }

        if (Object.keys(updates).length > 0) {
            await update(sessionRef, updates);
        }
    }

    window.submitUserForm = async function() {
        var key = document.getElementById('editUserKey').value;
        var user = document.getElementById('inputUsername').value.trim();
        var pass = document.getElementById('inputPassword').value.trim();
        if (!user || !pass) { toast('املأ جميع الحقول', 'error'); return; }

        if (key) {
            // وضع التعديل
            var oldData = allUsers[key];
            var oldUsername = oldData.username;
            var passwordChanged = (oldData.password !== pass);
            var usernameChanged = (oldUsername !== user);

            try {
                // 1. حفظ التعديلات في جدول users
                await set(ref(db, 'users/' + key), {username: user, password: pass});
                
                // 2. تحديث/حذف الجلسات النشطة في جدول active_sessions
                if (usernameChanged || passwordChanged) {
                    await syncActiveSessions(oldUsername, user, passwordChanged);
                }

                toast('تم التحديث ومزامنة الجلسات', 'success');
                document.getElementById('userFormBox').style.display = 'none';
            } catch(error) {
                toast('حدث خطأ أثناء التحديث', 'error');
            }
        } else {
            // وضع الإنشاء
            push(ref(db, 'users'), {username: user, password: pass}).then(function() { 
                toast('تم الإنشاء', 'success'); 
                document.getElementById('userFormBox').style.display = 'none'; 
            });
        }
    };

    window.deleteUser = async function(key) {
        var ok = await showConfirm('هل أنت متأكد من حذف هذا المستخدم؟');
        if (ok) {
            var deletedUser = allUsers[key] ? allUsers[key].username : null;
            remove(ref(db, 'users/' + key)).then(async function() { 
                toast('تم الحذف', 'success'); 
                
                // حذف الجلسات النشطة لليوزر المحذوف
                if (deletedUser) {
                    const sessionRef = ref(db, 'active_sessions');
                    const snapshot = await get(sessionRef);
                    if (snapshot.exists()) {
                        const sessions = snapshot.val();
                        const promises = [];
                        for (let sessionKey in sessions) {
                            if (sessions[sessionKey].username === deletedUser) {
                                promises.push(remove(ref(db, 'active_sessions/' + sessionKey)));
                            }
                        }
                        await Promise.all(promises);
                    }
                }
            });
        }
    };

    function renderUsersList() {
        var list = document.getElementById('usersList');
        var keys = Object.keys(allUsers);
        document.getElementById('usrCount').textContent = keys.length;
        list.innerHTML = '';
        if (keys.length === 0) { list.innerHTML = '<div class="empty-state" style="padding:20px;text-align:center;color:var(--text-muted)"><p>لا يوزرات</p></div>'; return; }
        keys.forEach(function(key) {
            var u = allUsers[key];
            var el = document.createElement('div'); el.className = 'm-card';
            el.innerHTML = '<div class="m-row"><span class="m-label">المستخدم</span><span class="m-val"><b>' + u.username + '</b></span></div>' +
                '<div class="m-row"><span class="m-label">كلمة المرور</span><span class="m-val" style="color:var(--text-muted);font-size:12px;font-family:monospace">' + u.password + '</span></div>' +
                '<div class="m-actions"><button class="btn btn-primary btn-sm" style="flex:1" onclick="openUserForm(true,\'' + key + '\',\'' + u.username + '\',\'' + u.password + '\')"><i class="fas fa-edit"></i> تعديل</button><button class="btn btn-danger btn-sm" style="flex:1" onclick="deleteUser(\'' + key + '\')"><i class="fas fa-trash"></i> حذف</button></div>';
            list.appendChild(el);
        });
    }

    function updateSalesUsersDropdown() {
        var sel = document.getElementById('selectSalesUser');
        sel.innerHTML = '<option value="">-- الكل --</option>';
        var userSet = {};
        for (var k in allUsers) userSet[allUsers[k].username] = true;
        for (var a in allArchive) { if (allArchive[a].settled_by) userSet[allArchive[a].settled_by] = true; }
        Object.keys(userSet).sort().forEach(function(name) { sel.innerHTML += '<option value="' + name + '">' + name + '</option>'; });
    }

    /* =========================================
       💰 قسم المبيعات
       ========================================= */
    function filterArchiveData() {
        var selectedUser = document.getElementById('selectSalesUser').value;
        var startVal = document.getElementById('salesStartDate').value;
        var endVal = document.getElementById('salesEndDate').value;
        var filtered = [];
        for (var key in allArchive) {
            var item = allArchive[key];
            var itemTime = new Date(item.settled_at).getTime();
            var matchUser = true, matchDate = true;
            if (selectedUser && item.settled_by !== selectedUser) matchUser = false;
            if (startVal && itemTime < new Date(startVal).getTime()) matchDate = false;
            if (endVal && itemTime > new Date(endVal).getTime()) matchDate = false;
            if (matchUser && matchDate) filtered.push({key: key, ...item});
        }
        return filtered;
    }

    window.loadSalesStatistics = function() {
        var list = document.getElementById('salesList');
        var card = document.getElementById('totalSalesCard');
        var revSection = document.getElementById('userRevSection');
        list.innerHTML = ''; card.style.display = 'none'; revSection.style.display = 'none';
        var results = filterArchiveData();
        document.getElementById('salesCount').textContent = results.length;
        if (results.length === 0) { list.innerHTML = '<div class="empty-state" style="padding:20px;text-align:center;color:var(--text-muted)"><p>لا توجد نتائج</p></div>'; return; }
        var totalSum = 0;
        results.forEach(function(order) {
            var sum = Number(order.price) * Number(order.quantity); totalSum += sum;
            var el = document.createElement('div'); el.className = 'm-card';
            el.innerHTML = '<div class="m-row"><span class="m-label">المادة</span><span class="m-val"><b>' + order.name + '</b></span></div>' +
                '<div class="m-row"><span class="m-label">طاولة</span><span class="badge badge-blue">طاولة ' + order.table_number + '</span></div>' +
                '<div class="m-row"><span class="m-label">الإجمالي</span><span class="m-val" style="color:var(--success)">' + fmt(sum) + ' د.ع</span></div>' +
                '<div class="m-row"><span class="m-label">بواسطة</span><span class="badge badge-amber">' + (order.settled_by || '—') + '</span></div>' +
                '<div class="m-row"><span class="m-label">التاريخ</span><span class="m-val" style="font-size:10px;color:var(--text-secondary)">' + new Date(order.settled_at).toLocaleString('ar-IQ') + '</span></div>';
            list.appendChild(el);
        });
        card.style.display = 'block';
        document.getElementById('totalSalesBody').innerHTML = '<div style="text-align:center"><span style="color:var(--text-secondary);font-size:12px">إجمالي الفترة</span><div style="font-size:24px;font-weight:900;color:var(--danger);margin-top:4px">' + fmt(totalSum) + ' د.ع</div></div>';
    };

    window.deleteSalesByPeriod = async function() {
        var results = filterArchiveData();
        if (results.length === 0) { toast('لا سجلات بالفترة المحددة', 'error'); return; }
        var ok = await showConfirm('تحذير: حذف (' + results.length + ') سجل نهائياً؟');
        if (!ok) return;
        var promises = results.map(function(item) { return remove(ref(db, 'tablesD/archive_orders/' + item.key)); });
        Promise.all(promises).then(function() { toast('تم الحذف', 'success'); document.getElementById('totalSalesCard').style.display = 'none'; });
    };

    window.calculateTotalRevenueAllUsers = function() {
        var startVal = document.getElementById('salesStartDate').value;
        var endVal = document.getElementById('salesEndDate').value;
        var userMap = {}; var grandTotal = 0, grandCount = 0;
        for (var key in allArchive) {
            var item = allArchive[key]; var itemTime = new Date(item.settled_at).getTime(); var matchDate = true;
            if (startVal && itemTime < new Date(startVal).getTime()) matchDate = false;
            if (endVal && itemTime > new Date(endVal).getTime()) matchDate = false;
            if (!matchDate) continue;
            var user = item.settled_by || 'غير محدد'; var sum = Number(item.price) * Number(item.quantity);
            grandTotal += sum; grandCount++;
            if (!userMap[user]) userMap[user] = {total: 0, count: 0};
            userMap[user].total += sum; userMap[user].count++;
        }
        var card = document.getElementById('totalSalesCard'); card.style.display = 'block';
        document.getElementById('totalSalesBody').innerHTML = '<div style="text-align:center"><span style="color:var(--text-secondary);font-size:12px">صافي العوائد الكلية</span><div style="font-size:28px;font-weight:900;color:var(--success);margin:6px 0">' + fmt(grandTotal) + ' د.ع</div><span style="font-size:11px;color:var(--text-muted)">إجمالي الفواتير: ' + grandCount + '</span></div>';
        
        var section = document.getElementById('userRevSection'); var grid = document.getElementById('userRevGrid');
        section.style.display = 'block'; grid.innerHTML = '';
        var maxRev = 0; for (var u in userMap) { if (userMap[u].total > maxRev) maxRev = userMap[u].total; }
        for (var uname in userMap) {
            var ud = userMap[uname]; var pct = maxRev > 0 ? Math.round((ud.total / maxRev) * 100) : 0;
            var initials = uname.substring(0, 2).toUpperCase();
            var cardEl = document.createElement('div'); cardEl.className = 'user-rev-card';
            cardEl.innerHTML = '<div class="ur-avatar">' + initials + '</div><div class="ur-name">' + uname + '</div><div class="ur-total">' + fmt(ud.total) + '</div><div class="ur-count">' + ud.count + ' عملية</div><div class="ur-bar"><div class="ur-bar-fill" style="width:0%"></div></div>';
            cardEl.addEventListener('click', function() { document.getElementById('selectSalesUser').value = uname; loadSalesStatistics(); window.scrollTo({top: 0, behavior: 'smooth'}); });
            grid.appendChild(cardEl);
            setTimeout(function(fillEl, percent) { fillEl.style.width = percent + '%'; }.bind(null, cardEl.querySelector('.ur-bar-fill'), pct), 100);
        }
    };

    /* =========================================
       📦 قسم المنتجات
       ========================================= */
    function renderOrdersStatsList() {
        var list = document.getElementById('ordersList'); list.innerHTML = '';
        var archiveQty = {};
        for (var id in allArchive) { var item = allArchive[id]; if (!archiveQty[item.name]) archiveQty[item.name] = {qty: 0, money: 0}; archiveQty[item.name].qty += Number(item.quantity); archiveQty[item.name].money += (Number(item.price) * Number(item.quantity)); }
        var totalProducts = 0; var hasData = false;
        for (var catKey in allMenu) {
            var category = allMenu[catKey]; var items = category.items || {};
            for (var itemKey in items) {
                hasData = true; totalProducts++; var product = items[itemKey]; var sold = archiveQty[product.name] || {qty: 0, money: 0};
                var el = document.createElement('div'); el.className = 'm-card';
                el.innerHTML = '<div class="m-row"><span class="m-label">المنتج</span><span class="m-val"><b>' + product.name + '</b></span></div>' +
                    '<div class="m-row"><span class="m-label">القسم</span><span class="m-val" style="color:var(--text-muted);font-size:11px">' + (category.name || '—') + '</span></div>' +
                    '<div style="display:flex;justify-content:space-between;gap:10px">' +
                    '<div style="flex:1;text-align:center;background:var(--info-bg);padding:6px;border-radius:6px"><div style="font-size:10px;color:var(--info)">الكمية المباعة</div><div style="font-weight:800;color:var(--info)">' + sold.qty + '</div></div>' +
                    '<div style="flex:1;text-align:center;background:var(--success-bg);padding:6px;border-radius:6px"><div style="font-size:10px;color:var(--success)">العوائد</div><div style="font-weight:800;color:var(--success)">' + fmt(sold.money) + '</div></div>' +
                    '</div>';
                list.appendChild(el);
            }
        }
        document.getElementById('prodCount').textContent = totalProducts;
        if (!hasData) list.innerHTML = '<div class="empty-state" style="padding:20px;text-align:center;color:var(--text-muted)"><p>لا منتجات</p></div>';
    }

    initSystemCore();

    /* ===== سكربت تثبيت الـ PWA ===== */
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
    const isAppInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    function isIos() { return /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase()); }
    function isSafari() { const ua = window.navigator.userAgent.toLowerCase(); return ua.includes('safari') && !ua.includes('chrome') && !ua.includes('crios'); }
    window.closeIosPrompt = function() { 
        document.getElementById('ios-prompt').style.display = 'none'; 
        localStorage.setItem('iosPromptDismissed', 'true'); 
    }
    
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => console.log('Captain PWA Ready!'));
    }
    if (isIos() && isSafari() && !isAppInstalled && !localStorage.getItem('iosPromptDismissed')) {
        document.getElementById('ios-prompt').style.display = 'block';
    }
</script>
