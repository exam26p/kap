<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة البيانات والنطاق الجغرافي</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .form-container, .list-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
            box-sizing: border-box;
        }
        h2, h3 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 10px;
        }
        .btn-success { background-color: #28a745; color: white; }
        .btn-success:hover { background-color: #218838; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-primary:hover { background-color: #0069d9; }
        .btn-warning { background-color: #ffc107; color: #212529; font-weight: bold; }
        .btn-warning:hover { background-color: #e0a905; }
        .btn-danger { background-color: #dc3545; color: white; padding: 6px 12px; font-size: 14px; width: auto; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-edit { background-color: #17a2b8; color: white; padding: 6px 12px; font-size: 14px; width: auto; margin-left: 5px; }
        .btn-edit:hover { background-color: #138496; }
        
        button:disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed;
        }
        .location-status {
            font-size: 14px;
            margin-top: 8px;
            color: #0056b3;
            font-weight: bold;
            text-align: center;
        }
        /* تصميم قائمة عرض المواقع */
        .location-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }
        .location-item h4 {
            margin: 0 0 10px 0;
            color: #007bff;
        }
        .location-item p {
            margin: 5px 0;
            font-size: 14px;
            color: #555;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }
        .badge-edit {
            background-color: #ffc107;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 id="formTitle">إضافة نسخة جديدة ونطاق جغرافي</h2>
    
    <div id="editModeIndicator" style="display: none;" class="badge-edit">🔄 أنت الآن في وضع تعديل بيانات نسخة معينة</div>

    <form id="dataForm">
        <div class="form-group">
            <label for="versionNumber">رقم النسخة:</label>
            <input type="text" id="versionNumber" required placeholder="مثال: 1.0.2">
        </div>

        <div class="form-group">
            <button type="button" id="getLocationBtn" class="btn-primary">تحديد/تحديث مركز النطاق الحالي (100 متر)</button>
            <div id="locationStatus" class="location-status">لم يتم تحديد الموقع بعد.</div>
        </div>

        <button type="submit" id="submitBtn" class="btn-success" disabled>حفظ البيانات في Firebase</button>
        <button type="button" id="cancelEditBtn" class="btn-danger" style="display: none; width: 100%;">إلغاء التعديل والعودة للإضافة</button>
    </form>
</div>

<div class="list-container">
    <h3>المواقع والنطاقات المحفوظة حالياً</h3>
    <div id="locationsList">جاري تحميل المواقع من Firebase...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyCEEqEALOCaQo5oSoR8A_Jh9eSpHS8Sz5o",
        authDomain: "game1-bb93e.firebaseapp.com",
        databaseURL: "https://game1-bb93e-default-rtdb.firebaseio.com",
        projectId: "game1-bb93e",
        storageBucket: "game1-bb93e.firebasestorage.app",
        messagingSenderId: "268851425259",
        appId: "1:268851425259:web:0074f52657190d7347b3ae"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // متغيرات التحكم بالوضع والموقع
    let centerLatitude = null;
    let centerLongitude = null;
    let locationAccuracy = null;
    let editNodeKey = null; // سيحمل الـ ID الخاص بالسجل عند التعديل

    const getLocationBtn = document.getElementById('getLocationBtn');
    const locationStatus = document.getElementById('locationStatus');
    const submitBtn = document.getElementById('submitBtn');
    const dataForm = document.getElementById('dataForm');
    const locationsList = document.getElementById('locationsList');
    
    // عناصر واجهة التعديل
    const formTitle = document.getElementById('formTitle');
    const editModeIndicator = document.getElementById('editModeIndicator');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    // --- 1. جلب الإحداثيات من الـ GPS ---
    getLocationBtn.addEventListener('click', () => {
        if (navigator.geolocation) {
            locationStatus.innerText = "جاري تحديد الموقع بدقة عالية... انتظر قليلاً";
            
            const options = {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(successLocation, errorLocation, options);
        } else {
            locationStatus.innerText = "المتصفح الخاص بك لا يدعم تحديد المواقع.";
        }
    });

    function successLocation(position) {
        centerLatitude = position.coords.latitude;
        centerLongitude = position.coords.longitude;
        locationAccuracy = position.coords.accuracy;

        locationStatus.innerHTML = `
            ✅ تم التقاط الإحداثيات بنجاح!<br>
            خط العرض: ${centerLatitude.toFixed(7)}<br>
            خط الطول: ${centerLongitude.toFixed(7)}<br>
            نسبة الدقة: +/- ${locationAccuracy.toFixed(1)} متر
        `;
        locationStatus.style.color = "#28a745";
        submitBtn.disabled = false; 
    }

    function errorLocation(error) {
        locationStatus.style.color = "#dc3545";
        switch(error.code) {
            case error.PERMISSION_DENIED:
                locationStatus.innerText = "يرجى السماح بالوصول إلى الموقع الجغرافي لتحديد الإحداثيات.";
                break;
            case error.POSITION_UNAVAILABLE:
                locationStatus.innerText = "معلومات الموقع غير متوفرة حالياً.";
                break;
            case error.TIMEOUT:
                locationStatus.innerText = "انتهت مهلة جلب الموقع، يرجى المحاولة مجدداً في مكان مكشوف.";
                break;
            default:
                locationStatus.innerText = "حدث خطأ غير معروف أثناء جلب الموقع.";
                break;
        }
    }

    // --- 2. جلب وعرض البيانات المحفوظة في الوقت الفعلي (Realtime) ---
    const cobesRef = ref(database, 'cobes');
    
    onValue(cobesRef, (snapshot) => {
        locationsList.innerHTML = ""; // تنظيف القائمة قبل العرض الجديد
        
        if (snapshot.exists()) {
            const data = snapshot.val();
            
            // تحويل الكائن إلى مصفوفة لعرض الأحدث أولاً
            Object.keys(data).reverse().forEach((key) => {
                const item = data[key];
                const geo = item.geo_zone || {};
                
                const itemDiv = document.createElement('div');
                itemDiv.className = 'location-item';
                itemDiv.innerHTML = `
                    <h4>النسخة: ${item.version_number}</h4>
                    <p><b>خط العرض:</b> ${geo.center_latitude}</p>
                    <p><b>خط الطول:</b> ${geo.center_longitude}</p>
                    <p><b>نصف القطر:</b> ${geo.radius_meters} متر</p>
                    <p><small style="color:#777;">تاريخ الحفظ: ${new Date(item.created_at).toLocaleString('ar-EG')}</small></p>
                    <div class="actions">
                        <button class="btn-edit" data-id="${key}">تعديل الموقِع</button>
                        <button class="btn-danger" data-id="${key}">حذف</button>
                    </div>
                `;
                locationsList.appendChild(itemDiv);
            });

            // تفعيل أزرار التعديل والحذف برمجياً
            activateListButtons(data);

        } else {
            locationsList.innerText = "لا توجد مواقع محفوظة حالياً في قاعدة البيانات.";
        }
    });

    // ربط الأفعال بأزرار التعديل والحذف داخل القائمة
    function activateListButtons(allData) {
        // أزرار الحذف
        document.querySelectorAll('.btn-danger[data-id]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = e.target.getAttribute('data-id');
                if(confirm("هل أنت متأكد من حذف هذا الموقع نهائياً؟")) {
                    remove(ref(database, `cobes/${id}`))
                    .then(() => alert("تم الحذف بنجاح."))
                    .catch(err => alert("حدث خطأ أثناء الحذف: " + err.message));
                }
            });
        });

        // أزرار التعديل
        document.querySelectorAll('.btn-edit[data-id]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const id = e.target.getAttribute('data-id');
                const targetData = allData[id];
                
                // الدخول في وضع التحرير
                editNodeKey = id;
                document.getElementById('versionNumber').value = targetData.version_number;
                
                // الاحتفاظ بالإحداثيات القديمة مؤقتاً لحين رغبة المستخدم بتغييرها
                centerLatitude = targetData.geo_zone.center_latitude;
                centerLongitude = targetData.geo_zone.center_longitude;
                locationAccuracy = targetData.geo_zone.accuracy_registered || 0;

                locationStatus.innerHTML = `
                    ⚠️ تم تحميل بيانات الموقع القديم للتعديل.<br>
                    خط العرض الحالي: ${centerLatitude}<br>
                    خط الطول الحالي: ${centerLongitude}<br>
                    (يمكنك الضغط على زر تحديد المركز بالأعلى لتحديث الإحداثيات لموقعك الحالي)
                `;
                locationStatus.style.color = "#ffc107";

                // تحويل شكل النموذج لواجهة التعديل
                formTitle.innerText = "تعديل بيانات النسخة والنطاق";
                editModeIndicator.style.display = "block";
                cancelEditBtn.style.display = "block";
                submitBtn.innerText = "تحديث البيانات في Firebase";
                submitBtn.className = "btn-warning";
                submitBtn.disabled = false; // تفعيله مباشرة لأن هناك بيانات قديمة محملة بالفعل
                
                // الانتقال لأعلى الصفحة بسلاسة ليرى المستخدم النموذج
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }

    // --- 3. حفظ أو تحديث البيانات عند إرسال النموذج ---
    dataForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const version = document.getElementById('versionNumber').value;

        const targetData = {
            version_number: version,
            geo_zone: {
                center_latitude: centerLatitude,
                center_longitude: centerLongitude,
                radius_meters: 100,
                accuracy_registered: locationAccuracy
            },
            created_at: new Date().toISOString()
        };

        if (editNodeKey) {
            // [وضع التعديل]: تحديث السجل الحالي بناءً على الـ ID الفريد
            update(ref(database, `cobes/${editNodeKey}`), targetData)
            .then(() => {
                alert('تم تحديث بيانات الموقع بنجاح!');
                resetFormToNormal();
            })
            .catch((error) => alert("خطأ أثناء التحديث: " + error.message));
        } else {
            // [وضع الإضافة الجديد]: توليد ID جديد وإضافة البيانات
            const newCobeRef = push(cobesRef);
            set(newCobeRef, targetData)
            .then(() => {
                alert('تم حفظ بيانات النسخة والنطاق الجديد بنجاح!');
                resetFormToNormal();
            })
            .catch((error) => alert("خطأ أثناء الحفظ: " + error.message));
        }
    });

    // إلغاء وضع التعديل والعودة للوضع الطبيعي عند الضغط على إلغاء
    cancelEditBtn.addEventListener('click', resetFormToNormal);

    // دالة لإعادة تهيئة النموذج لوضعه الأصلي
    function resetFormToNormal() {
        editNodeKey = null;
        centerLatitude = null;
        centerLongitude = null;
        locationAccuracy = null;
        
        dataForm.reset();
        
        formTitle.innerText = "إضافة نسخة جديدة ونطاق جغرافي";
        editModeIndicator.style.display = "none";
        cancelEditBtn.style.display = "none";
        
        submitBtn.innerText = "حفظ البيانات في Firebase";
        submitBtn.className = "btn-success";
        submitBtn.disabled = true;

        locationStatus.innerText = "لم يتم تحديد الموقع بعد.";
        locationStatus.style.color = "#0056b3";
    }
</script>

</body>
</html>
