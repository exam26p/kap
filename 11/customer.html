<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طلباتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --bg: #0b1120; --bg2: #111b2e; --card: #172036; --border: #1e2d4a;
            --fg: #f1f5f9; --muted: #6b7fa3; --accent: #00e5a0; --accent-dim: rgba(0,229,160,0.1);
            --danger: #ff4757; --danger-dim: rgba(255,71,87,0.1); --warning: #ffb347;
            --warning-dim: rgba(255,179,71,0.1); --info: #38bdf8; --info-dim: rgba(56,189,248,0.1);
            --radius: 14px; --radius-sm: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }

        .page-header {
            padding: 18px 20px 14px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 50;
        }

        .page-header h1 { font-size: 1rem; font-weight: 700; flex: 1; }

        /* تبويبات */
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); }
        .tab {
            flex: 1; padding: 13px; border: none; background: none; color: var(--muted);
            font-family: 'Cairo', sans-serif; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; position: relative; transition: color 0.25s;
        }

        .tab.active { color: var(--accent); }
        .tab.active::after {
            content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
            height: 2.5px; background: var(--accent); border-radius: 2px;
        }

        .tab:active { background: rgba(255,255,255,0.02); }

        /* قائمة الطلبات */
        .orders-list { padding: 12px 20px 40px; display: flex; flex-direction: column; gap: 10px; }

        .order-card {
            padding: 16px; border-radius: var(--radius); background: var(--card);
            border: 1px solid var(--border); transition: all 0.2s;
        }

        .order-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .order-rest { font-size: 0.9rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .order-rest i { color: var(--accent); font-size: 0.8rem; }

        .order-status { font-size: 0.7rem; font-weight: 700; padding: 3px 12px; border-radius: 20px; }
        .order-status.pending { background: var(--warning-dim); color: var(--warning); }
        .order-status.preparing { background: var(--info-dim); color: var(--info); }
        .order-status.on_way { background: rgba(168,85,247,0.1); color: #a855f7; }
        .order-status.delivered { background: var(--accent-dim); color: var(--accent); }

        .order-items { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }

        .order-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid var(--border); }
        .order-total { font-size: 1rem; font-weight: 900; color: var(--accent); }
        .order-date { font-size: 0.7rem; color: var(--muted); }

        .order-type-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
        .order-type-badge.table { background: var(--accent-dim); color: var(--accent); }
        .order-type-badge.delivery { background: var(--warning-dim); color: var(--warning); }

        .empty-orders { text-align: center; padding: 60px 20px; color: var(--muted); opacity: 0.3; }
        .empty-orders i { font-size: 3rem; display: block; margin-bottom: 12px; }
        .empty-orders span { font-size: 0.85rem; }

        .toast-container {
            position: fixed; top: 16px; left: 16px; right: 16px; z-index: 99999;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }

        .toast {
            padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.82rem;
            font-weight: 600; display: flex; align-items: center; gap: 8px;
            pointer-events: auto; font-family: 'Cairo', sans-serif;
            animation: toastIn 0.3s ease, toastOut 0.3s 2.5s ease forwards;
        }

        .toast.info { background: var(--info-dim); color: var(--info); border: 1px solid rgba(56,189,248,0.2); }

        @keyframes toastIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-15px); } }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../data.js"></script>
    <script src="../loc.js"></script>
</head>
<body>

    <div class="toast-container" id="toast-container"></div>

    <div class="page-header">
        <h1>طلباتي</h1>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="current" onclick="switchTab('current')">الحالية</button>
        <button class="tab" data-tab="past" onclick="switchTab('past')">السابقة</button>
    </div>

    <div class="orders-list" id="orders-list">
        <div class="empty-orders">
            <i class="fa-solid fa-bag-shopping"></i>
            <span>لا توجد طلبات حالياً</span>
        </div>
    </div>

    <script>
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();
        var activeTab = 'current';
        var devId = localStorage.getItem('smart_menu_device_id');

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.toggle('active', t.getAttribute('data-tab') === tab);
            });
            loadOrders();
        }

        function loadOrders() {
            if (!devId) return;

            var list = document.getElementById('orders-list');
            list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size:1.2rem;"></i></div>';

            var query = db.collection('orders').where('customer_device', '==', devId);

            if (activeTab === 'current') {
                query = query.where('status', 'in', ['pending', 'preparing', 'on_way']);
            } else {
                query = query.where('status', '==', 'delivered');
            }

            query.orderBy('created_at', 'desc').get().then(function(snap) {
                if (snap.empty) {
                    var msg = activeTab === 'current' ? 'لا توجد طلبات حالية' : 'لا توجد طلبات سابقة';
                    list.innerHTML = '<div class="empty-orders"><i class="fa-solid fa-bag-shopping"></i><span>' + msg + '</span></div>';
                    return;
                }

                var html = '';
                snap.forEach(function(doc) {
                    var d = doc.data();
                    var statusLabels = { pending: 'قيد الانتظار', preparing: 'قيد التحضير', on_way: 'في الطريق', delivered: 'تم التوصيل' };
                    var itemsText = (d.items || []).map(function(i) { return i.name + ' x' + i.qty; }).join('، ');
                    var date = d.created_at ? new Date(d.created_at.seconds * 1000).toLocaleDateString('ar-IQ') : '--';
                    var typeBadge = d.type === 'table'
                        ? '<span class="order-type-badge table">طاولة ' + (d.table_number || '') + '</span>'
                        : '<span class="order-type-badge delivery">توصيل</span>';

                    html += '<div class="order-card">' +
                        '<div class="order-top">' +
                            '<div class="order-rest"><i class="fa-solid fa-store"></i> ' + escHtml(d.restaurant_name || 'مطعم') + ' ' + typeBadge + '</div>' +
                            '<span class="order-status ' + d.status + '">' + (statusLabels[d.status] || d.status) + '</span>' +
                        '</div>' +
                        '<div class="order-items">' + escHtml(itemsText) + '</div>' +
                        '<div class="order-bottom">' +
                            '<span class="order-total">' + (d.total || 0).toLocaleString() + ' د.ع</span>' +
                            '<span class="order-date">' + date + '</span>' +
                        '</div>' +
                    '</div>';
                });
                list.innerHTML = html;
            }).catch(function() {
                list.innerHTML = '<div class="empty-orders"><i class="fa-solid fa-bag-shopping"></i><span>خطأ في تحميل الطلبات</span></div>';
            });
        }

        function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        window.onload = function() { loadOrders(); };
    </script>
</body>
</html>
