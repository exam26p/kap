<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المينيو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --bg: #0b1120; --bg2: #111b2e; --card: #172036; --border: #1e2d4a;
            --fg: #f1f5f9; --muted: #6b7fa3; --accent: #00e5a0; --accent-dim: rgba(0,229,160,0.1);
            --danger: #ff4757; --warning: #ffb347; --warning-dim: rgba(255,179,71,0.1);
            --info: #38bdf8; --info-dim: rgba(56,189,248,0.1);
            --radius: 14px; --radius-sm: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow-x: hidden; }

        .page-header {
            padding: 18px 20px 14px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 50;
        }

        .back-btn {
            width: 36px; height: 36px; border-radius: 10px; background: var(--card);
            border: 1px solid var(--border); color: var(--muted);
            display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem;
        }

        .back-btn:active { background: var(--border); }
        .page-header h1 { font-size: 1rem; font-weight: 700; flex: 1; }
        .table-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; background: var(--accent-dim); color: var(--accent); }

        /* تبويبات التصنيفات */
        .cats-scroll {
            display: flex; gap: 8px; padding: 14px 20px; overflow-x: auto;
            -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--border);
        }

        .cats-scroll::-webkit-scrollbar { display: none; }

        .cat-chip {
            padding: 8px 18px; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
            white-space: nowrap; cursor: pointer; border: 1.5px solid var(--border);
            background: var(--card); color: var(--muted); transition: all 0.25s;
            font-family: 'Cairo', sans-serif;
        }

        .cat-chip:active { transform: scale(0.95); }
        .cat-chip.active { background: var(--accent); color: #0a0e1a; border-color: var(--accent); }

        /* قائمة الأصناف */
        .items-list { padding: 12px 20px 120px; display: flex; flex-direction: column; gap: 10px; }

        .item-card {
            display: flex; gap: 14px; padding: 14px; border-radius: var(--radius);
            background: var(--card); border: 1px solid var(--border); transition: all 0.2s;
        }

        .item-card:active { background: var(--border); }

        .item-img {
            width: 80px; height: 80px; border-radius: 12px; background: var(--bg2);
            flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
            color: var(--muted); font-size: 1.5rem;
        }

        .item-img img { width: 100%; height: 100%; object-fit: cover; }

        .item-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
        .item-name { font-size: 0.95rem; font-weight: 700; }
        .item-desc { font-size: 0.75rem; color: var(--muted); line-height: 1.4; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .item-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .item-price { font-size: 0.95rem; font-weight: 900; color: var(--accent); }

        .add-btn {
            width: 34px; height: 34px; border-radius: 10px; border: none;
            background: var(--accent); color: #0a0e1a; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:active { transform: scale(0.9); }

        /* سلة المشتريات العائمة */
        .cart-float {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            padding: 14px 20px; border-radius: var(--radius);
            background: linear-gradient(135deg, #00e5a0, #00b87a); color: #0a0e1a;
            display: none; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 30px rgba(0,229,160,0.3); cursor: pointer; z-index: 100;
            font-weight: 700; font-size: 0.95rem; transition: all 0.3s;
        }

        .cart-float:active { transform: scale(0.97); }
        .cart-float.show { display: flex; }
        .cart-float .cart-count { background: rgba(0,0,0,0.15); padding: 2px 10px; border-radius: 20px; font-size: 0.8rem; }

        .empty-menu { text-align: center; padding: 60px 20px; color: var(--muted); opacity: 0.4; }
        .empty-menu i { font-size: 3rem; display: block; margin-bottom: 12px; }

        .toast-container {
            position: fixed; top: 16px; left: 16px; right: 16px; z-index: 99999;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }

        .toast {
            padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.82rem;
            font-weight: 600; display: flex; align-items: center; gap: 8px;
            pointer-events: auto; font-family: 'Cairo', sans-serif;
            animation: toastIn 0.3s ease, toastOut 0.3s 2s ease forwards;
        }

        .toast.success { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,229,160,0.2); }
        .toast.info { background: var(--info-dim); color: var(--info); border: 1px solid rgba(56,189,248,0.2); }

        @keyframes toastIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-15px); } }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../data.js"></script>
</head>
<body>

    <div class="toast-container" id="toast-container"></div>

    <div class="page-header">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-right"></i></button>
        <h1 id="menu-title">المينيو</h1>
        <span class="table-badge" id="table-badge">طاولة --</span>
    </div>

    <div class="cats-scroll" id="cats-scroll"></div>
    <div class="items-list" id="items-list"></div>

    <div class="cart-float" id="cart-float" onclick="showToast('صفحة السلة قيد التطوير','info')">
        <span>عرض السلة</span>
        <span class="cart-count" id="cart-count">0 أصناف</span>
    </div>

    <script>
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var params = new URLSearchParams(window.location.search);
        var restId = params.get('id');
        var tableNum = params.get('table') || '--';
        var cartItems = 0;
        var activeCat = null;

        document.getElementById('table-badge').innerText = 'طاولة ' + tableNum;

        function goBack() { if (window.history.length > 1) window.history.back(); else window.location.href = 'food.html?id=' + restId; }

        function showToast(msg, type) {
            var c = document.getElementById('toast-container');
            var t = document.createElement('div');
            t.className = 'toast ' + (type || 'info');
            t.innerHTML = '<i class="fa-solid fa-circle-info"></i> ' + msg;
            c.appendChild(t);
            setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2500);
        }

        function loadMenu() {
            if (!restId) return;

            // اسم المطعم
            db.collection('restaurants').doc(restId).get().then(function(doc) {
                if (doc.exists) document.getElementById('menu-title').innerText = doc.data().name;
            }).catch(function() {});

            // تحميل التصنيفات
            db.collection('restaurants').doc(restId).collection('menu').get().then(function(snap) {
                var catsEl = document.getElementById('cats-scroll');
                if (snap.empty) {
                    catsEl.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:0.82rem;opacity:0.5;">لا توجد تصنيفات بعد</div>';
                    showEmptyItems();
                    return;
                }

                var firstCat = null;
                snap.forEach(function(catDoc) {
                    var catId = catDoc.id;
                    var catName = catDoc.data().name || catId;
                    if (!firstCat) firstCat = catId;

                    var chip = document.createElement('button');
                    chip.className = 'cat-chip';
                    chip.innerText = catName;
                    chip.setAttribute('data-cat', catId);
                    chip.onclick = function() { selectCat(catId); };
                    catsEl.appendChild(chip);
                });

                if (firstCat) selectCat(firstCat);
            }).catch(function() { showEmptyItems(); });
        }

        function selectCat(catId) {
            activeCat = catId;
            document.querySelectorAll('.cat-chip').forEach(function(c) {
                c.classList.toggle('active', c.getAttribute('data-cat') === catId);
            });

            var list = document.getElementById('items-list');
            list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted);"><i class="fa-solid fa-spinner fa-spin" style="font-size:1.2rem;"></i></div>';

            db.collection('restaurants').doc(restId).collection('menu').doc(catId).collection('items').get().then(function(snap) {
                if (snap.empty) { showEmptyItems(); return; }

                var html = '';
                snap.forEach(function(itemDoc) {
                    var d = itemDoc.data();
                    html += '<div class="item-card">' +
                        '<div class="item-img"><i class="fa-solid fa-bowl-food"></i></div>' +
                        '<div class="item-info">' +
                            '<div class="item-name">' + escHtml(d.name) + '</div>' +
                            '<div class="item-desc">' + escHtml(d.desc || '') + '</div>' +
                            '<div class="item-bottom">' +
                                '<span class="item-price">' + (d.price || 0).toLocaleString() + ' د.ع</span>' +
                                '<button class="add-btn" onclick="addToCart()"><i class="fa-solid fa-plus"></i></button>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                });
                list.innerHTML = html;
            }).catch(function() { showEmptyItems(); });
        }

        function addToCart() {
            cartItems++;
            document.getElementById('cart-count').innerText = cartItems + ' أصناف';
            document.getElementById('cart-float').classList.add('show');
            showToast('تمت الإضافة للسلة', 'success');
        }

        function showEmptyItems() {
            document.getElementById('items-list').innerHTML = '<div class="empty-menu"><i class="fa-solid fa-utensils"></i>لا توجد أصناف في هذا التصنيف</div>';
        }

        function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

        window.onload = function() { loadMenu(); };
    </script>
</body>
</html>
