<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
    <title>منيو سريع | تشكيلة مميزة</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Noto+Kufi+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background: #FAF6F0;
            padding-bottom: 78px;
            color: #2C3E2D;
            overflow-x: hidden;
        }

        /* التصميم العام للمنيو */
        :root {
            --bg: #FAF6F0;
            --bg-card: #FFFFFF;
            --gold: #C9A96E;
            --gold-light: #E8D5A8;
            --olive: #3D5A3E;
            --olive-light: #5A7D5C;
            --text-dark: #2C3E2D;
            --text-body: #4A5D4B;
            --border-soft: #EDE7DB;
            --red: #B85450;
            --green-btn: #4A7C59;
            --shadow: rgba(61, 90, 62, 0.08);
        }

        /* شاشة البداية (splash) */
        #splashScreen {
            position: fixed;
            inset: 0;
            background: linear-gradient(145deg, #2C3E2D, #3D5A3E);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        #splashScreen.hide {
            opacity: 0;
            transform: scale(1.02);
            pointer-events: none;
        }

        .splash-logo {
            width: 95px;
            height: 95px;
            background: linear-gradient(135deg, var(--gold), #A68B4B);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: gentleFloat 2.6s infinite;
            border: 3px solid rgba(255,255,240,0.2);
        }

        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .splash-title {
            color: #F5EFE6;
            font-size: 28px;
            font-weight: 800;
            margin-top: 18px;
            letter-spacing: -0.5px;
        }

        .splash-sub {
            color: rgba(212,228,209,0.7);
            font-size: 13px;
            margin-bottom: 40px;
        }

        .splash-btn {
            background: var(--gold);
            border: none;
            padding: 12px 42px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 60px;
            color: #2C3E2D;
            margin-top: 25px;
            opacity: 0;
            transform: translateY(12px);
            transition: 0.25s;
            cursor: pointer;
            font-family: 'Noto Kufi Arabic', sans-serif;
            box-shadow: 0 5px 18px rgba(201,169,110,0.3);
        }

        .splash-btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* شاشة التحقق الجغرافي (بسيطة) */
        #geoBlock {
            position: fixed;
            inset: 0;
            background: #2C3E2D;
            z-index: 99998;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            flex-direction: column;
        }

        .geo-card {
            background: rgba(255,255,245,0.05);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 32px;
            max-width: 360px;
        }

        /* القائمة الرئيسية */
        #menuContent {
            display: none;
            max-width: 560px;
            margin: 0 auto;
            padding: 0 12px;
        }

        /* رأس المنيو */
        .resto-header {
            background: linear-gradient(115deg, var(--olive), var(--olive-light));
            border-radius: 28px;
            padding: 18px 18px;
            margin: 12px 0 20px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
        }

        .resto-title h2 {
            color: white;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .resto-title p {
            color: rgba(255,250,210,0.7);
            font-size: 10px;
        }

        .table-badge {
            background: rgba(255,255,200,0.15);
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;
            color: var(--gold-light);
        }

        /* أقسام المنيو (أكورديون سريع) */
        .cat-card {
            background: white;
            border-radius: 24px;
            margin-bottom: 18px;
            overflow: hidden;
            box-shadow: 0 5px 14px rgba(0,0,0,0.03);
            transition: all 0.2s;
            border: 1px solid #F0E9DF;
        }

        .cat-header {
            position: relative;
            height: 105px;
            cursor: pointer;
            overflow: hidden;
        }

        .cat-header img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .cat-header .cat-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 12px 16px;
            color: white;
        }

        .cat-name {
            font-size: 20px;
            font-weight: 800;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .cat-count {
            font-size: 12px;
            background: rgba(0,0,0,0.4);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .cat-arrow {
            transition: transform 0.25s;
            font-size: 14px;
        }

        .cat-card.open .cat-arrow {
            transform: rotate(180deg);
        }

        .cat-items {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.38s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            background: #FFFFFF;
        }

        .cat-card.open .cat-items {
            max-height: 2000px;
        }

        /* ⭐ بطاقة المنتج - بنفس حجم وتصميم الصورة المرفقة ⭐ */
        .item-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            border-bottom: 1px solid #F2EBE2;
            transition: background 0.1s;
        }
        .item-card:active { background: #FEF9F2; }

        .item-img {
            width: 78px;
            height: 78px;
            border-radius: 20px;
            background: #F4EFE8;
            overflow: hidden;
            flex-shrink: 0;
            border: 1.5px solid var(--gold-light);
            box-shadow: 0 6px 12px rgba(0,0,0,0.02);
        }

        .item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 800;
            font-size: 15px;
            color: #2C3E2D;
            margin-bottom: 4px;
        }

        .item-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .item-price {
            font-weight: 800;
            font-size: 17px;
            font-family: 'Playfair Display', monospace;
            color: var(--red);
            letter-spacing: -0.3px;
        }

        .order-actions {
            display: flex;
            gap: 9px;
            align-items: center;
        }

        .detail-toggle {
            background: none;
            border: 1px solid #E9E0D4;
            width: 34px;
            height: 34px;
            border-radius: 12px;
            color: #8F9B86;
            cursor: pointer;
            transition: 0.1s;
            font-size: 14px;
        }

        .detail-toggle.active {
            background: #E8F0E4;
            border-color: var(--olive-light);
            color: var(--olive);
        }

        .order-btn {
            background: linear-gradient(105deg, var(--green-btn), #2F6B47);
            border: none;
            padding: 7px 16px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 12px;
            gap: 4px;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 8px rgba(74,124,89,0.2);
        }

        .order-btn:active { transform: scale(0.96); }

        .item-detail-wrap {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.2s ease;
            margin-top: 0px;
        }

        .item-detail-wrap.open {
            grid-template-rows: 1fr;
        }

        .item-detail-inner {
            overflow: hidden;
        }

        .item-desc {
            padding: 6px 0 6px 88px;
            font-size: 12px;
            color: #6B7A66;
            line-height: 1.6;
            border-top: 1px dashed #F0E5D8;
            margin-top: 6px;
        }

        /* البار السفلي */
        .bottom-order-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255,252,245,0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            border-top: 1px solid #EFE6DC;
            z-index: 500;
            font-weight: 700;
        }

        .view-cart-btn {
            background: linear-gradient(125deg, var(--gold), #BB9B60);
            border: none;
            padding: 9px 22px;
            border-radius: 40px;
            color: #2C3E2D;
            font-weight: 800;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* مودال السلة */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(44,62,45,0.5);
            backdrop-filter: blur(6px);
            z-index: 2000;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 28px 28px 0 0;
            padding: 18px;
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp 0.25s;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #F0EAE1;
        }

        .qty-control {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 40px;
            border: 1px solid #E2D8CD;
            background: white;
            font-weight: bold;
            cursor: pointer;
        }

        .send-order {
            background: var(--gold);
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 60px;
            font-weight: 800;
            margin-top: 18px;
            color: #2C3E2D;
            font-size: 16px;
        }

        .toast-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2a1c;
            color: #F5EFE6;
            padding: 10px 24px;
            border-radius: 50px;
            z-index: 12000;
            font-size: 13px;
            pointer-events: none;
            animation: fadeOut 2.5s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
        }

        .dist-bar {
            background: #EDE6DC;
            margin: 6px 14px;
            border-radius: 60px;
            height: 6px;
            overflow: hidden;
        }

        .dist-fill {
            width: 0%;
            height: 100%;
            background: var(--gold);
            transition: width 0.2s;
        }
    </style>
</head>
<body>

<div id="splashScreen">
    <div class="splash-logo">🍽️</div>
    <div class="splash-title">منيو الوادي</div>
    <div class="splash-sub">أسرع تجربة رقمية</div>
    <button class="splash-btn" id="enterBtn">دخول ⚡</button>
</div>

<div id="geoBlock" style="display: none;">
    <div class="geo-card">
        <i class="fas fa-map-marker-alt" style="font-size: 45px; color: #C9A96E; margin-bottom: 12px;"></i>
        <h3 style="color:#F5EFE6;">جاري التحقق من الموقع</h3>
        <p style="color:#BCC9B4; margin-top: 8px;">الرجاء تفعيل الخدمات المكانية</p>
    </div>
</div>

<div id="menuContent">
    <div class="resto-header">
        <div class="resto-title">
            <h2><i class="fas fa-utensils"></i> مطعم النخبة</h2>
            <p>أشهى المأكولات بجودة عالية</p>
        </div>
        <div class="table-badge" id="tableLabel">طاولة 1</div>
    </div>
    <div class="dist-bar" id="distanceBar"><div class="dist-fill" id="distFillLine"></div></div>
    <div id="categoriesContainer"></div>
</div>

<div class="bottom-order-bar" id="bottomBar" style="display: none;">
    <span>🛒 الإجمالي: <strong id="totalAmount">٠ د.ع</strong></span>
    <button class="view-cart-btn" id="cartBtn"><i class="fas fa-receipt"></i> الفاتورة <span id="cartBadge" style="background:#B85450; border-radius:30px; padding:0 8px; color:white;">0</span></button>
</div>

<div id="cartModal" class="modal">
    <div class="modal-card">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px;"><h3>📋 طلباتي</h3><button id="closeModalBtn" style="background:none; border:none; font-size:24px;">&times;</button></div>
        <div id="cartItemsList"></div>
        <div id="cartTotalDisplay" style="font-weight:800; font-size:18px; margin:12px 0; text-align:center;"></div>
        <button id="confirmSendBtn" class="send-order"><i class="fas fa-paper-plane"></i> إرسال للمطبخ</button>
        <div style="margin-top:14px; background:#F8F4EF; border-radius:16px; padding:10px;"><small>✅ الطلبات المُرسلة سابقاً:</small>
            <div id="sentHistoryList" style="font-size:12px; color:#5D6E58;">لا توجد طلبات مرسلة</div>
        </div>
    </div>
</div>

<script>
    // ---------- بيانات المنيو السريعة (تم تحميلها فوراً في الخلفية) ----------
    // هيكل المنيو بنفس تصميم الصورة: أقسام + أصناف مع صور وهمية عالية الجودة
    const MENU_STRUCTURE = {
        "المقبلات الباردة": {
            image: "https://placehold.co/400x200/F5E6D3/A68B4B?text=مقبلات",
            items: [
                { name: "حمص باللحم", price: 9000, details: "حمص شهي بقطع اللحم المقدد والصنوبر.", image: "https://placehold.co/300x300/EADBC6/A87B3E?text=حمص" },
                { name: "كص لحم ناشف", price: 9000, details: "أشهى أنواع الكص المجفف بتتبيلة خاصة.", image: "https://placehold.co/300x300/DFD1BD/9B6E3A?text=ناشف" },
                { name: "كص لحم عادي", price: 4500, details: "لحم طري بنكهة شرقية.", image: "https://placehold.co/300x300/DFD1BD/9B6E3A?text=كص" },
                { name: "متبل ورق عنب", price: 5500, details: "محشي بأرز ولحم مفروم.", image: "https://placehold.co/300x300/E9DFCF/A07B4C?text=ورق" }
            ]
        },
        "الوجبات الرئيسية": {
            image: "https://placehold.co/400x200/DCC9A8/8B6940?text=رئيسية",
            items: [
                { name: "مندي لحم", price: 12500, details: "لحم الضأن مع أرز بنكهة الفحم.", image: "https://placehold.co/300x300/E5D5BD/A37448?text=مندي" },
                { name: "دجاج برياني", price: 9500, details: "دجاج مع بهارات هندية وأرز بسمتي.", image: "https://placehold.co/300x300/F0E3D2/B6844C?text=برياني" },
                { name: "مقلقل لحم", price: 10500, details: "لحم مع خضار مشكلة وصلصة خاصة.", image: "https://placehold.co/300x300/EBDDCB/A7784A?text=مقلقل" }
            ]
        },
        "المشروبات": {
            image: "https://placehold.co/400x200/C7B28B/866A42?text=مشروبات",
            items: [
                { name: "عرق سوس", price: 2000, details: "طبيعي ومنعش.", image: "https://placehold.co/300x300/D8CFBC/8C6A42?text=عرق" },
                { name: "ليمون نعناع", price: 2500, details: "عصير طازج.", image: "https://placehold.co/300x300/E3D6C4/A77C48?text=ليمون" }
            ]
        }
    };

    // تحويل إلى قائمة مسطحة سهلة الوصول
    let allItemsMap = new Map(); // key: "categoryName_itemName" -> full item
    let categoryKeys = [];
    for (let catName in MENU_STRUCTURE) {
        categoryKeys.push(catName);
        let catData = MENU_STRUCTURE[catName];
        catData.items.forEach((item, idx) => {
            let key = `${catName}_${item.name}`;
            allItemsMap.set(key, { ...item, category: catName, originalKey: key });
        });
    }

    // السلة المحلية (بدون Firebase حاليًا لكن سريع) 
    let cart = {};  // key: catName_itemName -> { name, price, quantity, details, image }
    let sentOrdersHistory = [];

    // عناصر DOM
    const splash = document.getElementById('splashScreen');
    const enterBtn = document.getElementById('enterBtn');
    const geoBlockDiv = document.getElementById('geoBlock');
    const menuContentDiv = document.getElementById('menuContent');
    const bottomBar = document.getElementById('bottomBar');
    const categoriesContainer = document.getElementById('categoriesContainer');
    const cartModal = document.getElementById('cartModal');
    const cartItemsList = document.getElementById('cartItemsList');
    const cartTotalDisplay = document.getElementById('cartTotalDisplay');
    const confirmSendBtn = document.getElementById('confirmSendBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const totalAmountSpan = document.getElementById('totalAmount');
    const cartBadge = document.getElementById('cartBadge');
    const sentHistoryDiv = document.getElementById('sentHistoryList');
    const tableLabelSpan = document.getElementById('tableLabel');

    // تحديد رقم الطاولة من الـ URL (محاكاة)
    const urlParams = new URLSearchParams(window.location.search);
    const tableNo = urlParams.get('table') || '1';
    tableLabelSpan.innerText = `طاولة ${tableNo}`;

    // عرض رسائل (toast سريع)
    function showToast(msg, isError = false) {
        const toastDiv = document.createElement('div');
        toastDiv.className = 'toast-msg';
        toastDiv.innerText = msg;
        toastDiv.style.background = isError ? '#B85450' : '#2F5E3A';
        document.body.appendChild(toastDiv);
        setTimeout(() => toastDiv.remove(), 2600);
    }

    // تحديث واجهة السلة والبار
    function updateCartUI() {
        let total = 0;
        let totalQuantity = 0;
        for (let key in cart) {
            const q = cart[key].quantity;
            total += cart[key].price * q;
            totalQuantity += q;
        }
        totalAmountSpan.innerText = total.toLocaleString('ar-IQ') + " د.ع";
        cartBadge.innerText = totalQuantity;
        if (totalQuantity === 0) bottomBar.style.display = "none";
        else bottomBar.style.display = "flex";
        renderCartModal();
    }

    function renderCartModal() {
        if (!cartItemsList) return;
        const entries = Object.values(cart);
        if (entries.length === 0) {
            cartItemsList.innerHTML = '<p style="text-align:center;color:#8E9B87;">لا توجد طلبات معلقة</p>';
            cartTotalDisplay.innerText = 'الإجمالي: ٠ د.ع';
            confirmSendBtn.disabled = true;
            return;
        }
        let total = 0;
        let html = '';
        for (let item of entries) {
            const subtotal = item.price * item.quantity;
            total += subtotal;
            html += `
                <div class="cart-item">
                    <div><strong>${item.name}</strong><br><span style="font-size:12px;">${item.price.toLocaleString('ar-IQ')} د.ع</span></div>
                    <div class="qty-control">
                        <button class="qty-btn decr" data-key="${item.key}">−</button>
                        <span style="min-width: 28px; text-align:center;">${item.quantity}</span>
                        <button class="qty-btn incr" data-key="${item.key}">+</button>
                    </div>
                    <span>${subtotal.toLocaleString('ar-IQ')} د.ع</span>
                </div>
            `;
        }
        cartItemsList.innerHTML = html;
        cartTotalDisplay.innerText = `الإجمالي: ${total.toLocaleString('ar-IQ')} د.ع`;
        confirmSendBtn.disabled = false;

        document.querySelectorAll('.decr').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const k = btn.getAttribute('data-key');
                if (cart[k]) {
                    cart[k].quantity -= 1;
                    if (cart[k].quantity <= 0) delete cart[k];
                    updateCartUI();
                }
            });
        });
        document.querySelectorAll('.incr').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const k = btn.getAttribute('data-key');
                if (cart[k]) {
                    cart[k].quantity += 1;
                    updateCartUI();
                }
            });
        });
    }

    function addToCart(catName, itemObj) {
        const key = `${catName}_${itemObj.name}`;
        if (cart[key]) {
            cart[key].quantity += 1;
        } else {
            cart[key] = {
                name: itemObj.name,
                price: itemObj.price,
                quantity: 1,
                details: itemObj.details,
                image: itemObj.image,
                key: key
            };
        }
        updateCartUI();
        showToast(`✅ تم إضافة ${itemObj.name}`, false);
    }

    function sendOrdersToKitchen() {
        if (Object.keys(cart).length === 0) {
            showToast("السلة فارغة!", true);
            return;
        }
        // محاكاة الإرسال للمطبخ: نسخ الطلبات إلى سجل المرسلات ومسح السلة
        const currentOrders = Object.values(cart).map(it => ({ name: it.name, quantity: it.quantity, price: it.price, time: new Date().toLocaleTimeString() }));
        sentOrdersHistory.unshift(...currentOrders);
        if (sentOrdersHistory.length > 10) sentOrdersHistory.length = 10;
        // تحديث واجهة التاريخ
        if (sentHistoryDiv) {
            if (sentOrdersHistory.length === 0) sentHistoryDiv.innerHTML = 'لا توجد طلبات مرسلة';
            else {
                sentHistoryDiv.innerHTML = sentOrdersHistory.map(s => `<div>▪️ ${s.name} (×${s.quantity}) - ${(s.price*s.quantity).toLocaleString('ar-IQ')} د.ع</div>`).join('');
            }
        }
        cart = {};
        updateCartUI();
        showToast("🎉 تم إرسال طلباتك للمطبخ بنجاح!", false);
        if (cartModal.style.display === 'flex') renderCartModal();
    }

    // بناء المنيو بشكل خاطف (تحميل خلفي)
    function buildMenuLightning() {
        categoriesContainer.innerHTML = '';
        for (let catName of categoryKeys) {
            const catData = MENU_STRUCTURE[catName];
            const catDiv = document.createElement('div');
            catDiv.className = 'cat-card';
            // header
            const header = document.createElement('div');
            header.className = 'cat-header';
            const imgCat = document.createElement('img');
            imgCat.src = catData.image;
            imgCat.alt = catName;
            imgCat.loading = 'eager';
            const overlay = document.createElement('div');
            overlay.className = 'cat-overlay';
            overlay.innerHTML = `<span class="cat-name">${catName}</span><span class="cat-count">${catData.items.length} أصناف <i class="fas fa-chevron-down cat-arrow"></i></span>`;
            header.appendChild(imgCat);
            header.appendChild(overlay);
            // items container
            const itemsDiv = document.createElement('div');
            itemsDiv.className = 'cat-items';
            catData.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                const imgSide = document.createElement('div');
                imgSide.className = 'item-img';
                const imgEl = document.createElement('img');
                imgEl.src = item.image;
                imgEl.alt = item.name;
                imgEl.loading = 'lazy';
                imgSide.appendChild(imgEl);
                const infoDiv = document.createElement('div');
                infoDiv.className = 'item-info';
                const nameSpan = document.createElement('div');
                nameSpan.className = 'item-name';
                nameSpan.innerText = item.name;
                const priceRow = document.createElement('div');
                priceRow.className = 'item-price-row';
                const priceSpan = document.createElement('span');
                priceSpan.className = 'item-price';
                priceSpan.innerText = item.price.toLocaleString('ar-IQ') + ' د.ع';
                const actionDiv = document.createElement('div');
                actionDiv.className = 'order-actions';
                const detailBtn = document.createElement('button');
                detailBtn.className = 'detail-toggle';
                detailBtn.innerHTML = '<i class="fas fa-info-circle"></i>';
                const orderBtn = document.createElement('button');
                orderBtn.className = 'order-btn';
                orderBtn.innerHTML = '<i class="fas fa-plus"></i> طلب';
                actionDiv.appendChild(detailBtn);
                actionDiv.appendChild(orderBtn);
                priceRow.appendChild(priceSpan);
                priceRow.appendChild(actionDiv);
                infoDiv.appendChild(nameSpan);
                infoDiv.appendChild(priceRow);
                card.appendChild(imgSide);
                card.appendChild(infoDiv);
                // تفاصيل إضافية قابلة للطي
                const detailWrap = document.createElement('div');
                detailWrap.className = 'item-detail-wrap';
                const innerWrap = document.createElement('div');
                innerWrap.className = 'item-detail-inner';
                const descDiv = document.createElement('div');
                descDiv.className = 'item-desc';
                descDiv.innerText = item.details || 'تفاصيل إضافية عن الطبق.';
                innerWrap.appendChild(descDiv);
                detailWrap.appendChild(innerWrap);
                card.appendChild(detailWrap);
                itemsDiv.appendChild(card);
                // event details
                detailBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    detailWrap.classList.toggle('open');
                    detailBtn.classList.toggle('active');
                });
                orderBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(catName, item);
                });
            });
            catDiv.appendChild(header);
            catDiv.appendChild(itemsDiv);
            categoriesContainer.appendChild(catDiv);
            header.addEventListener('click', () => {
                const isOpen = catDiv.classList.contains('open');
                document.querySelectorAll('.cat-card.open').forEach(c => c.classList.remove('open'));
                if (!isOpen) catDiv.classList.add('open');
            });
            // افتح أول قسم تلقائياً لجعل التجربة فورية
            if (catName === categoryKeys[0]) catDiv.classList.add('open');
        }
    }

    // محاكاة التحقق السريع (بدون تأخير)
    function fastGeoMock() {
        return new Promise((resolve) => {
            setTimeout(() => {
                resolve(true);
            }, 300); // سرعة خاطفة
        });
    }

    // تهيئة التطبيق السريع: تحميل المنيو في الخلفية أثناء splash
    let menuPreloaded = false;
    async function initApp() {
        // الخطوة 1 : تحميل المنيو فورًا (في الخلفية)
        buildMenuLightning();
        menuPreloaded = true;
        // محاكاة موقع سريع
        const geoOk = await fastGeoMock();
        if (geoOk) {
            // إخفاء splash وعرض القائمة
            splash.classList.add('hide');
            setTimeout(() => {
                splash.style.display = 'none';
                geoBlockDiv.style.display = 'none';
                menuContentDiv.style.display = 'block';
                bottomBar.style.display = Object.keys(cart).length ? 'flex' : 'none';
                updateCartUI();
                // محاكاة شريط المسافة 100%
                const fillLine = document.getElementById('distFillLine');
                if (fillLine) fillLine.style.width = '100%';
            }, 500);
        } else {
            showToast("لا يمكن تحديد الموقع, لكن يمكنك التصفح", true);
            splash.classList.add('hide');
            setTimeout(() => {
                splash.style.display = 'none';
                menuContentDiv.style.display = 'block';
                bottomBar.style.display = Object.keys(cart).length ? 'flex' : 'none';
            }, 400);
        }
    }

    // أزرار المودال
    document.getElementById('cartBtn')?.addEventListener('click', () => {
        cartModal.style.display = 'flex';
        renderCartModal();
    });
    closeModalBtn?.addEventListener('click', () => cartModal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === cartModal) cartModal.style.display = 'none'; });
    confirmSendBtn?.addEventListener('click', sendOrdersToKitchen);
    enterBtn?.addEventListener('click', () => { initApp(); });

    // عرض تاريخ المرسلات مبدئي فارغ
    if (sentHistoryDiv) sentHistoryDiv.innerHTML = 'لا توجد طلبات مرسلة';
    // استدعاء التحميل الخلفي الفوري لو ظل المستخدم على splash
    buildMenuLightning();

    // لمسة صوتية خفيفة اختيارية
    function beep() {} // لا حاجة لكن نبقى سريع
    document.querySelectorAll('.order-btn, .detail-toggle, .qty-btn, .view-cart-btn').forEach(btn => {
        if (btn) btn.addEventListener('click', () => {});
    });
</script>
</body>
</html>
