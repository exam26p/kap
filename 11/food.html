<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المطعم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

        :root {
            --bg: #0b1120; --bg2: #111b2e; --card: #172036; --border: #1e2d4a;
            --fg: #f1f5f9; --muted: #6b7fa3; --accent: #00e5a0; --accent-dim: rgba(0,229,160,0.1);
            --danger: #ff4757; --danger-dim: rgba(255,71,87,0.1); --warning: #ffb347;
            --warning-dim: rgba(255,179,71,0.1); --info: #38bdf8; --info-dim: rgba(56,189,248,0.1);
            --radius: 14px; --radius-sm: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--fg);
            min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
        }

        .page-header {
            padding: 18px 20px 14px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border); background: var(--bg2);
            position: sticky; top: 0; z-index: 50;
        }

        .back-btn {
            width: 36px; height: 36px; border-radius: 10px; background: var(--card);
            border: 1px solid var(--border); color: var(--muted);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
        }

        .back-btn:active { background: var(--border); }
        .page-header h1 { font-size: 1rem; font-weight: 700; flex: 1; }

        .restaurant-hero {
            padding: 24px 20px; text-align: center;
            background: linear-gradient(180deg, var(--bg2), var(--bg));
        }

        .restaurant-avatar {
            width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 14px;
            background: var(--accent-dim); border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: var(--accent);
        }

        .restaurant-name { font-size: 1.3rem; font-weight: 900; margin-bottom: 4px; }
        .restaurant-status { font-size: 0.8rem; color: var(--muted); }

        .mode-cards { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; }

        .mode-card {
            padding: 20px; border-radius: var(--radius); border: 1.5px solid var(--border);
            background: var(--card); display: flex; align-items: center; gap: 16px;
            cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
        }

        .mode-card:active { transform: scale(0.98); }
        .mode-card.disabled { opacity: 0.4; cursor: not-allowed; }
        .mode-card.disabled:active { transform: none; }

        .mode-card .mc-icon {
            width: 56px; height: 56px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }

        .mode-card .mc-icon.green { background: var(--accent-dim); color: var(--accent); }
        .mode-card .mc-icon.orange { background: var(--warning-dim); color: var(--warning); }

        .mode-card .mc-content { flex: 1; }
        .mode-card .mc-title { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
        .mode-card .mc-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
        .mode-card .mc-arrow { color: var(--muted); font-size: 0.85rem; }

        .mode-card .mc-badge {
            position: absolute; top: 12px; left: 12px;
            padding: 3px 10px; border-radius: 20px; font-size: 0.65rem; font-weight: 700;
        }

        .mc-badge.inside { background: var(--accent-dim); color: var(--accent); }
        .mc-badge.outside { background: var(--warning-dim); color: var(--warning); }
        .mc-badge.locked { background: var(--danger-dim); color: var(--danger); }

        /* كاميرا الباركود */
        .scanner-area {
            display: none; padding: 20px; flex-direction: column; align-items: center;
        }

        .scanner-area.open { display: flex; }

        .scanner-frame {
            width: 220px; height: 220px; border-radius: 20px;
            border: 3px solid var(--accent); position: relative;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px; overflow: hidden; background: #000;
        }

        .scanner-frame video { width: 100%; height: 100%; object-fit: cover; }

        .scanner-line {
            position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
            background: var(--accent); box-shadow: 0 0 10px var(--accent);
            animation: scanLine 2s ease-in-out infinite;
        }

        @keyframes scanLine {
            0%, 100% { top: 10%; }
            50% { top: 88%; }
        }

        .scanner-hint { font-size: 0.82rem; color: var(--muted); text-align: center; margin-bottom: 16px; }

        .scanner-corners::before, .scanner-corners::after,
        .scanner-frame::before, .scanner-frame::after {
            content: ''; position: absolute; width: 24px; height: 24px;
            border-color: var(--accent); border-style: solid; border-width: 0;
        }

        .scanner-frame::before { top: 8px; right: 8px; border-top-width: 3px; border-right-width: 3px; border-radius: 0 8px 0 0; }
        .scanner-frame::after { bottom: 8px; left: 8px; border-bottom-width: 3px; border-left-width: 3px; border-radius: 0 0 0 8px; }

        .btn-main {
            width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm);
            font-family: 'Cairo', sans-serif; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s;
        }

        .btn-main:active { transform: scale(0.97); }

        .btn-accent { background: linear-gradient(135deg, #00e5a0, #00b87a); color: #0a0e1a; }
        .btn-outline { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }

        .distance-info {
            margin: 0 20px 20px; padding: 14px 16px; border-radius: var(--radius-sm);
            background: var(--info-dim); border: 1px solid rgba(56,189,248,0.15);
            display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--info);
        }

        .toast-container {
            position: fixed; top: 16px; left: 16px; right: 16px; z-index: 99999;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none;
        }

        .toast {
            padding: 12px 16px; border-radius: var(--radius-sm); font-size: 0.82rem;
            font-weight: 600; display: flex; align-items: center; gap: 8px;
            pointer-events: auto; font-family: 'Cairo', sans-serif;
            animation: toastIn 0.3s ease, toastOut 0.3s 2.5s ease forwards;
        }

        .toast.success { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(0,229,160,0.2); }
        .toast.error { background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); }
        .toast.info { background: var(--info-dim); color: var(--info); border: 1px solid rgba(56,189,248,0.2); }

        @keyframes toastIn { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-15px); } }

        .placeholder-section {
            padding: 40px 20px; text-align: center; color: var(--muted); opacity: 0.3; font-size: 0.85rem;
        }

        .placeholder-section i { font-size: 2.5rem; display: block; margin-bottom: 12px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../data.js"></script>
    <script src="../loc.js"></script>
</head>
<body>

    <div class="toast-container" id="toast-container"></div>

    <div class="page-header">
        <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-right"></i></button>
        <h1 id="rest-name-header">المطعم</h1>
    </div>

    <div class="restaurant-hero">
        <div class="restaurant-avatar"><i class="fa-solid fa-store"></i></div>
        <div class="restaurant-name" id="rest-name">--</div>
        <div class="restaurant-status" id="rest-status">جاري التحميل...</div>
    </div>

    <div class="distance-info" id="distance-info" style="display:none;">
        <i class="fa-solid fa-location-dot"></i>
        <span id="distance-text">جاري حساب المسافة...</span>
    </div>

    <!-- اختيار وضع الطلب -->
    <div class="mode-cards" id="mode-cards">
        <div class="mode-card" id="mode-table" onclick="openTableScanner()">
            <span class="mc-badge inside" id="table-badge">داخل المطعم</span>
            <div class="mc-icon green"><i class="fa-solid fa-utensils"></i></div>
            <div class="mc-content">
                <div class="mc-title">طاولة</div>
                <div class="mc-desc">تصوير باركود الطاولة لعرض المينيو</div>
            </div>
            <i class="fa-solid fa-chevron-left mc-arrow"></i>
        </div>

        <div class="mode-card" id="mode-delivery" onclick="openDelivery()">
            <span class="mc-badge outside" id="delivery-badge">خارج المطعم</span>
            <div class="mc-icon orange"><i class="fa-solid fa-motorcycle"></i></div>
            <div class="mc-content">
                <div class="mc-title">توصيل</div>
                <div class="mc-desc">اطلب سفري وتوصيل لباب بيتك</div>
            </div>
            <i class="fa-solid fa-chevron-left mc-arrow"></i>
        </div>
    </div>

    <!-- كاميرا مسح الباركود -->
    <div class="scanner-area" id="scanner-area">
        <div class="scanner-frame">
            <video id="scanner-video" autoplay playsinline></video>
            <div class="scanner-line"></div>
        </div>
        <div class="scanner-hint">وجّه الكاميرا نحو باركود الطاولة</div>
        <button class="btn-main btn-accent" onclick="simulateScan()" style="max-width:300px;">
            <i class="fa-solid fa-qrcode"></i> محاكاة المسح (لتطوير)
        </button>
        <button class="btn-main btn-outline" onclick="closeScanner()" style="max-width:300px;margin-top:8px;">
            <i class="fa-solid fa-xmark"></i> إلغاء
        </button>
    </div>

    <script>
        firebase.initializeApp(firebaseConfig);
        var db = firebase.firestore();

        var restId = new URLSearchParams(window.location.search).get('id');
        var restData = null;
        var scannerStream = null;
        var myLat = null, myLng = null;
        var REST_RADIUS = 50; // أمتار — سيكون من إعدادات المطعم لاحقاً

        function goBack() { if (window.history.length > 1) window.history.back(); else window.location.href = '../index.html'; }

        function showToast(msg, type) {
            var c = document.getElementById('toast-container');
            var t = document.createElement('div');
            t.className = 'toast ' + (type || 'info');
            var icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            t.innerHTML = '<i class="fa-solid ' + (icons[type] || icons.info) + '"></i> ' + msg;
            c.appendChild(t);
            setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            var R = 6371000, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // تحميل بيانات المطعم
        function loadRestaurant() {
            if (!restId) { showToast('معرّف المطعم غير موجود', 'error'); return; }

            db.collection('restaurants').doc(restId).get().then(function(doc) {
                if (!doc.exists) { showToast('المطعم غير موجود', 'error'); return; }
                restData = doc.data();
                document.getElementById('rest-name').innerText = restData.name;
                document.getElementById('rest-name-header').innerText = restData.name;
                document.getElementById('rest-status').innerText = restData.status === 'approved' ? 'مفتوح الآن' : 'قيد المراجعة';

                // حساب المسافة
                checkDistance();
            }).catch(function(e) { showToast('خطأ: ' + e.message, 'error'); });
        }

        // حساب المسافة من موقعي للمطعم
        function checkDistance() {
            if (!restData || !restData.location) return;

            var info = document.getElementById('distance-info');
            info.style.display = 'flex';

            // قراءة موقعي من loc.js (آخر موقع في loc/{deviceId})
            var devId = localStorage.getItem('smart_menu_device_id');
            if (!devId) { document.getElementById('distance-text').innerText = 'لا يمكن تحديد موقعك'; return; }

            db.collection('loc').doc(devId).get().then(function(doc) {
                if (!doc.exists) { document.getElementById('distance-text').innerText = 'لا يوجد موقع محفوظ'; return; }
                var loc = doc.data();
                myLat = loc.latitude;
                myLng = loc.longitude;

                var dist = getDistance(myLat, myLng, restData.location.lat, restData.location.lng);
                var distText = dist < 1000 ? dist.toFixed(1) + ' متر' : (dist / 1000).toFixed(2) + ' كم';
                document.getElementById('distance-text').innerText = 'أنت على بعد ' + distText + ' من المطعم';

                var tableCard = document.getElementById('mode-table');
                var tableBadge = document.getElementById('table-badge');
                var deliveryCard = document.getElementById('mode-delivery');
                var deliveryBadge = document.getElementById('delivery-badge');

                if (dist <= REST_RADIUS) {
                    tableCard.classList.remove('disabled');
                    tableBadge.className = 'mc-badge inside';
                    tableBadge.innerText = 'متاح';
                    deliveryCard.classList.add('disabled');
                    deliveryBadge.className = 'mc-badge locked';
                    deliveryBadge.innerText = 'غير متاح';
                } else {
                    tableCard.classList.add('disabled');
                    tableBadge.className = 'mc-badge locked';
                    tableBadge.innerText = 'بعيد عن المطعم';
                    deliveryCard.classList.remove('disabled');
                    deliveryBadge.className = 'mc-badge outside';
                    deliveryBadge.innerText = 'متاح';
                }
            }).catch(function() { document.getElementById('distance-text').innerText = 'خطأ في تحديد المسافة'; });
        }

        // فتح كاميرا مسح الباركود
        function openTableScanner() {
            if (!restData || !restData.location) return;
            var tableCard = document.getElementById('mode-table');
            if (tableCard.classList.contains('disabled')) { showToast('أنت بعيد عن المطعم', 'error'); return; }

            document.getElementById('mode-cards').style.display = 'none';
            document.getElementById('scanner-area').classList.add('open');

            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(function(stream) {
                scannerStream = stream;
                document.getElementById('scanner-video').srcObject = stream;
            }).catch(function() {
                showToast('فشل في الوصول للكاميرا', 'error');
                closeScanner();
            });
        }

        function closeScanner() {
            if (scannerStream) { scannerStream.getTracks().forEach(function(t) { t.stop(); }); scannerStream = null; }
            document.getElementById('scanner-video').srcObject = null;
            document.getElementById('scanner-area').classList.remove('open');
            document.getElementById('mode-cards').style.display = 'flex';
        }

        // محاكاة المسح — سيُستبدل لاحقاً بمكتبة باركود حقيقية
        function simulateScan() {
            showToast('تم مسح الطاولة رقم 5 — جاري فتح المينيو', 'success');
            closeScanner();
            // الانتقال لصفحة المينيو لاحقاً
            // window.location.href = 'menu.html?id=' + restId + '&table=5';
        }

        function openDelivery() {
            var deliveryCard = document.getElementById('mode-delivery');
            if (deliveryCard.classList.contains('disabled')) { showToast('التوصيل غير متاح حالياً', 'error'); return; }
            showToast('صفحة التوصيل السفري قيد التطوير', 'info');
            // window.location.href = 'menu.html?id=' + restId + '&mode=delivery';
        }

        window.onload = function() { loadRestaurant(); };
    </script>
</body>
</html>
